#include <stdio.h>
#include <stdint.h>
#include <stdlib.h>
#include <x86intrin.h>

static uint64_t olc(volatile uint8_t *p) {
    unsigned aux;
    _mm_mfence();
    uint64_t t0 = __rdtscp(&aux);
    uint8_t x = *p; (void)x;
    uint64_t t1 = __rdtscp(&aux);
    return t1 - t0;
}
static int kars(const void *a, const void *b) {
    uint64_t x = *(const uint64_t *)a, y = *(const uint64_t *)b;
    return (x > y) - (x < y);
}

int main(void) {
    static volatile uint8_t veri[64];
    uint64_t sicak[1000], soguk[1000];
    for (int i = 0; i < 1000; i++) {
        (void)veri[0];                      /* önbelleğe al */
        sicak[i] = olc(&veri[0]);
        _mm_clflush((const void *)&veri[0]); /* önbellekten at */
        _mm_mfence();
        soguk[i] = olc(&veri[0]);
    }
    qsort(sicak, 1000, sizeof(uint64_t), kars);
    qsort(soguk, 1000, sizeof(uint64_t), kars);
    printf("medyan isabet : %llu dongu\\n", (unsigned long long)sicak[500]);
    printf("medyan iska   : %llu dongu\\n", (unsigned long long)soguk[500]);
    return 0;
}

/* Sabit zamanlı eşitlik kontrolü: erken çıkış YOK, hepsini tara */
int esit_sabit(const unsigned char *a, const unsigned char *b, size_t n) {
    unsigned char fark = 0;
    for (size_t i = 0; i < n; i++) fark |= a[i] ^ b[i];
    return fark == 0;
}

function el(tag, attrs, kids) {
  var e = document.createElement(tag);
  if (attrs) for (var k in attrs) {
    if (k === "text") e.textContent = attrs[k];
    else e.setAttribute(k, attrs[k]);
  }
  (kids || []).forEach(function (c) {
    e.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  });
  return e;
}

var TTS = {
  chunks: [], idx: 0, active: false, paused: false, rate: 1, statusEl: null,
  supported: ("speechSynthesis" in window) && ("SpeechSynthesisUtterance" in window),
  voice: function () {
    var v = window.speechSynthesis.getVoices();
    for (var i = 0; i < v.length; i++) if (v[i].lang && v[i].lang.toLowerCase().indexOf("tr") === 0) return v[i];
    return null;
  },
  split: function (text) {
    var s = text.match(/[^.!?]+[.!?]+|[^.!?]+$/g) || [text];
    var out = [], cur = "";
    s.forEach(function (x) {
      if ((cur + x).length > 220 && cur) { out.push(cur.trim()); cur = x; } else cur += x;
    });
    if (cur.trim()) out.push(cur.trim());
    return out;
  },
  say: function (msg) { if (TTS.statusEl) TTS.statusEl.textContent = msg; },
  start: function (text) {
    if (!TTS.supported) { TTS.say("Bu tarayıcı sesli okumayı desteklemiyor."); return; }
    TTS.stop(true);
    TTS.chunks = TTS.split(text); TTS.idx = 0; TTS.active = true; TTS.paused = false;
    if (!TTS.voice()) TTS.say("Uyarı: Türkçe ses bulunamadı, sistemin varsayılan sesi kullanılıyor. Okunuş bozuk olabilir.");
    TTS.next();
  },
  next: function () {
    if (!TTS.active) return;
    if (TTS.idx >= TTS.chunks.length) { TTS.active = false; TTS.say("Bitti."); return; }
    var u = new SpeechSynthesisUtterance(TTS.chunks[TTS.idx]);
    u.lang = "tr-TR"; u.rate = TTS.rate;
    var v = TTS.voice(); if (v) u.voice = v;
    u.onend = function () { TTS.idx++; TTS.next(); };
    u.onerror = function (e) { if (e && e.error === "interrupted") return; TTS.active = false; TTS.say("Ses hatası: " + (e && e.error ? e.error : "bilinmiyor")); };
    window.speechSynthesis.speak(u);
    TTS.say("Okunuyor... (" + (TTS.idx + 1) + "/" + TTS.chunks.length + ")");
  },
  pause: function () { if (TTS.active && TTS.supported) { window.speechSynthesis.pause(); TTS.paused = true; TTS.say("Duraklatıldı."); } },
  resume: function () { if (TTS.active && TTS.supported) { window.speechSynthesis.resume(); TTS.paused = false; TTS.say("Devam ediyor."); } },
  stop: function (silent) {
    TTS.active = false; TTS.paused = false;
    if (TTS.supported) window.speechSynthesis.cancel();
    if (!silent) TTS.say("Durduruldu.");
  }
};
if (TTS.supported) window.speechSynthesis.onvoiceschanged = function () {};

4. Karşılaştırma: (input[i] ^ key[i % 8]) == (i + 0x41)
5. Tersine çevir: input[i] = key[i % 8] ^ (i + 0x41)
6. FLAG: LLA_REV_101`,
    dosya: "ctf/challenges/rev/rev",
    readme: "ctf/challenges/rev/README.md"
  },
  {
    ad: "fmt",
    baslik: "Format String",
    ders: "Aşama 1 & 2: C Programlama ve Bellek Yönetimi / x86-x64 Assembly",
    aciklama: `printf(input) çağrısıyla format string açığı var. target değişkenini 0x1337 yaparak flag'i almalısın.`,
    flag: "FLAG{LLA_FMT_MASTER}",
    ipucu: "%n format belirteci ile belleğe yazma yapabilirsin. target adresini bul ve stack konumunu dene.",
    cozulme: `1. target adresini bul: nm fmt | grep target
2. Stack'teki argüman konumunu dene: ./fmt "%p.%p.%p.%p.%p.%p.%p.%p"
3. %n ile belleğe yazma: target_adres + "%<konum>$n"
4. Örnek (python ile):
   import struct
   target = 0x404040  # nm ile bulduğun adres
   payload = struct.pack('<I', target) + b"%8\$n"
   ./fmt "$payload"`,
    dosya: "ctf/challenges/fmt/fmt",
    readme: "ctf/challenges/fmt/README.md"
  },
  {
    ad: "heap",
    baslik: "Heap Overflow",
    ders: "Aşama 1 & 4: C Programlama ve Bellek Yönetimi / Dinamik Analiz",
    aciklama: `İki heap chunk ayrılır. İlk chunk'a 128 bayt yazılır (64 baytlık alan için), bu da ikinci chunk'ın üzerini ve admin değişkenini overwrite eder. admin == 1 olduğunda flag verilir.`,
    flag: "FLAG{LLA_HEAP_PWNED}",
    ipucu: "a'nın 64 baytlık alanından fazla yaz (128 bayt) ve b'nin üzerindeki admin değişkenini 1 yap.",
    cozulme: `1. a = malloc(64), b = malloc(64)
2. fgets(a, 128, stdin) ile a'nın üzerinden b'ye yazılabilir
3. admin değişkeninin bellek adresini bul ve overwrite et
4. admin = 1 yapıldığında give_flag() çağrılır ve FLAG{LLA_HEAP_PWNED} verilir`,
    dosya: "ctf/challenges/heap/heap",
    readme: "ctf/challenges/heap/README.md"
  }
];

function ctfSayfa(secim) {
  app.innerHTML = "";
  window.scrollTo(0, 0);
  app.appendChild(el("p", null, [el("a", { href: "#ana-sayfa", text: "[ Ana sayfa ]" })]));

  if (!secim) {
    app.appendChild(el("h2", { text: "CTF Challenge'ları" }));
    app.appendChild(el("p", { text: "Aşağıdaki challenge'lar derslerle %40 oranında alakalıdır. ctf/ klasöründe kaynak kodları ve çözümleri bulunur." }));
    var tbl = el("table", { border: "1", cellpadding: "4", cellspacing: "0", width: "100%" });
    tbl.appendChild(el("tr", null, [el("th", { text: "Challenge" }), el("th", { text: "Tür" }), el("th", { text: "İlgili Ders" })]));
    CTFLER.forEach(function (c) {
      tbl.appendChild(el("tr", null, [
        el("td", null, [el("a", { href: "#ctf-" + c.ad, text: c.baslik })]),
        el("td", { text: c.baslik }),
        el("td", { text: c.ders })
      ]));
    });
    app.appendChild(tbl);
    app.appendChild(el("hr"));
    app.appendChild(el("p", null, [el("a", { href: "#ana-sayfa", text: "Ders listesine dön" })]));
    return;
  }

  var c = CTFLER.find(function (x) { return x.ad === secim; });
  if (!c) { anaSayfa(); return; }

  app.appendChild(el("h2", { text: "CTF: " + c.baslik }));
  app.appendChild(el("p", null, [el("b", { text: "İlgili Ders: " }), c.ders]));
  app.appendChild(el("p", { text: c.aciklama }));

  /* Flag kontrolü */
  app.appendChild(el("h3", { text: "Flag Gönder" }));
  var flagInput = el("input", { type: "text", placeholder: "FLAG{...}" });
  var flagBtn = el("button", { type: "button", text: "Kontrol Et" });
  var flagSonuc = el("span", { text: "" });
  flagBtn.onclick = function () {
    if (flagInput.value.trim() === c.flag) {
      flagSonuc.textContent = "Tebrikler! Doğru flag: " + c.flag;
      flagSonuc.style.color = "green";
      flagSonuc.style.fontWeight = "bold";
    } else {
      flagSonuc.textContent = "Yanlış flag. Tekrar deneyin.";
      flagSonuc.style.color = "red";
    }
  };
  app.appendChild(el("p", null, [flagInput, " ", flagBtn, " ", flagSonuc]));

  /* İpucu (gizlenebilir) */
  app.appendChild(el("details", null, [
    el("summary", { text: "İpucu" }),
    el("p", { text: c.ipucu })
  ]));

  /* Çözüm (gizlenebilir) */
  app.appendChild(el("details", null, [
    el("summary", { text: "Çözümü Göster" }),
    el("pre", { text: c.cozulme })
  ]));

  /* Dosyalar / İndirme */
  app.appendChild(el("h3", { text: "Dosyalar" }));
  app.appendChild(el("p", null, [el("a", { href: c.dosya, text: "Derlenmiş dosyayı indir (" + c.dosya + ")", download: c.dosya.split("/").pop() })]));
  app.appendChild(document.createTextNode(" | "));
  app.appendChild(el("p", null, [el("a", { href: c.readme, text: "README indir (" + c.readme + ")", download: c.readme.split("/").pop() })]));

  app.appendChild(el("hr"));
  app.appendChild(el("p", null, [
    el("a", { href: "#ctf", text: "CTF listesine dön" }),
    "  |  ",
    el("a", { href: "#ana-sayfa", text: "Ana sayfa" })
  ]));
}

function yonlendir() {
  TTS.stop(true);
  if (location.hash === "#sozluk") { sozlukSayfa(); return; }
  if (location.hash === "#ctf") { ctfSayfa(null); return; }
  var m = /^#ctf-(.+)$/.exec(location.hash);
  if (m) { ctfSayfa(m[1]); return; }
  var d = /^#ders-(\d+)$/.exec(location.hash);
  var n = d ? parseInt(d[1], 10) : 0;
  if (n >= 1 && n <= DERSLER.length) dersSayfa(n); else { anaSayfa(); window.scrollTo(0, 0); }
}
window.addEventListener("hashchange", yonlendir);
yonlendir();
</script>
</body>
</html>
