  asama: 1, baslik: "Pointer aritmetiği",
  amac: `Bu derste p+1 ifadesinin neden bir bayt değil, işaret edilen tipin boyutu kadar ilerlediğini ve dizilerin pointer ile ilişkisini öğreneceksiniz.`,
  anlat: [
    `Pointer, bellekteki bir adresi tutan değişkendir. 64 bitlik sistemde sekiz bayt yer kaplar. Pointer'ın tipi ise o adreste ne tür bir verinin durduğunu derleyiciye söyler.`,
    `Bir pointer'a tam sayı eklediğinizde derleyici adresi, o sayı çarpı işaret edilen tipin boyutu kadar ilerletir. Yani p artı n ifadesi, adres artı n çarpı sizeof(*p) demektir. int dört bayt ise p artı bir adresi dört bayt artırır. char işaretçisinde bir bayt, double işaretçisinde sekiz bayt ilerler.`,
    `Dizi ismi çoğu ifadede ilk elemanın adresine dönüşür. a[i] yazmak ile *(a+i) yazmak birebir aynı şeydir. Bu yüzden dizi erişimleri assembly'de ofsetli adresleme olarak görünür.`,
    `İki pointer birbirinden çıkarılırsa sonuç bayt değil, eleman sayısıdır. Bu işlem yalnızca aynı diziye ait pointer'lar için anlamlıdır. Standart C'de void işaretçisi üzerinde aritmetik yoktur. Bayt bayt gezmek istiyorsanız unsigned char işaretçisi kullanılır.`,
    `Tersine mühendislik bağlantısı: decompiler çıktısında *(int *)(param_1 + 8) gibi bir ifade gördüğünüzde bu, bir struct alanına veya dizi elemanına yapılan ofsetli erişimdir. Assembly'de mov eax, [rdi+8] olarak karşınıza çıkar. Ghidra'da param_1 long gibi bir tamsayı tipindeyse artı sekiz bayt cinsindendir. Tip bir pointer'a çevrilirse ofset tipin boyutuyla çarpılır. Bu fark, çıktıyı yanlış okumanın en yaygın sebeplerinden biridir.`

  ozet: `Özetle: pointer'a eklenen sayı, tipin boyutuyla çarpılır. Dizi erişimi aslında pointer aritmetiğidir. Assembly'de bu, ofsetli bellek erişimi olarak görünür.`

{

  anlat: [
    `Stack otomatik yönetilir. Fonksiyon girince yer ayrılır, çıkınca geri verilir. Heap ise elle yönetilir. malloc ile istediğiniz büyüklükte bir blok alırsınız, işiniz bitince free ile geri verirsiniz. malloc başarısız olursa NULL döner, bu yüzden dönüş değeri her zaman kontrol edilmelidir.`,
    `Linux'taki glibc, her bloğun önünde bir başlık tutar. Bu başlıkta bloğun boyutu ve birkaç bayrak vardır. malloc'un size verdiği adres, başlıktan hemen sonrasıdır. 64 bitlik glibc'de bloklar on altı baytlık sınırlara hizalanır ve en küçük chunk otuz iki bayttır. Örneğin malloc(24) otuz iki baytlık bir chunk üretir, malloc(25) ise kırk sekiz baytlık.`,
    `free edilen bloklar silinmez. Allocator onları tcache, fastbin ve diğer listelerde saklar. Serbest bloğun içeriğinin ilk baytları artık veri değil, listedeki sonraki bloğu gösteren işaretçilerdir. Bu yüzden serbest bırakılmış belleği okumak size anlamsız ama zararsız görünen veriler verebilir.`,
    `Tipik hatalar şunlardır. Memory leak: free unutulur. Use-after-free: free edilen pointer kullanılmaya devam eder. Double free: aynı blok iki kez serbest bırakılır. Heap overflow: bloğun sınırı aşılır ve komşu chunk başlığı bozulur. İyi alışkanlık, free'den sonra pointer'ı NULL yapmaktır.`,
    `Tersine mühendislik bağlantısı: malloc'un dönüş değeri RAX'tadır. Decompiler'da malloc(0x28) gibi bir çağrı gördüğünüzde, o nesnenin yaklaşık 0x28 baytlık bir struct olduğunu tahmin edebilirsiniz. Bu, Ghidra'da struct tanımlarken en değerli ipuçlarından biridir.`

  uygulama: [

{
  asama: 1, baslik: "Stack frame yapısı",
  amac: `Bu derste bir fonksiyon çağrıldığında stack'in nasıl düzenlendiğini ve yerel değişkenlerin, dönüş adresinin nerede durduğunu öğreneceksiniz.`,
  anlat: [
    `Her fonksiyon çağrısı stack üzerinde bir çerçeve, yani frame oluşturur. CALL komutu dönüş adresini stack'e iter. Çağrılan fonksiyon genelde push rbp ve mov rbp, rsp ile eski taban işaretçisini saklayıp yeni tabanı kurar. Ardından sub rsp, N ile yerel değişkenler için yer açar.`,
    `Stack, yüksek adreslerden düşük adreslere doğru büyür. Çerçevenin düzeni yukarıdan aşağıya şöyledir: stack'e taşan argümanlar, dönüş adresi, saklanan RBP, yerel değişkenler. Yerel değişkenlere RBP'ye göre negatif ofsetlerle, örneğin [rbp-0x14] ile erişilir. Stack'e taşan argümanlara ise pozitif ofsetlerle erişilir.`,
    `System V ABI'de ilk altı tamsayı argümanı kayıtçılarla geçer, bu yüzden stack'e taşan argüman azdır. CALL komutu çalıştığı anda RSP'nin on altıya hizalı olması beklenir. Yaprak fonksiyonlar RSP'nin altındaki yüz yirmi sekiz baytlık red zone alanını kullanabilir.`,
    `Fonksiyondan çıkış leave ve ret ile olur. leave, RSP'yi RBP'ye eşitler ve saklanan RBP'yi geri yükler. ret ise dönüş adresini RIP'e alır. Optimizasyonlu kodda derleyici RBP'yi çerçeve işaretçisi olarak kullanmayabilir. O zaman erişimler RSP'ye göre ofsetli yapılır. Ghidra'daki local_ isimleri bu ofsetlerden türetilir.`,
    `Güvenlik bağlantısı: yerel bir dizi taşarsa, üstündeki saklı RBP ve dönüş adresi ezilebilir. Stack canary gibi korumalar bu yüzden vardır. Bu konuyu Aşama 4'te göreceksiniz.`

  kodBaslik: "Stack düzeni (yüksek adresten düşük adrese)",

düşük adres`,
  videolar: [
    { t: "x64 Assembly Tutorial 28: Stack Frames", u: "https://www.youtube.com/watch?v=kSgrKtA0rJM", d: "EN" },

  ],
  uygulama: [
    `İki parametreli ve iki yerel değişkenli bir C fonksiyonu yazıp gcc -S -masm=intel -O0 ile assembly'sini üretin. Her yerel değişkenin ofsetini not edin.`,
    `GDB'de fonksiyonun başında ve sonunda x/6gx $rsp çıktısını karşılaştırın.`,

  sorular: [
    { q: `Yerel değişkenler neden [rbp-N] biçiminde görünür?`, a: `Stack aşağı büyür. Yerel alanlar RBP'nin altında, yani daha düşük adreslerde bulunur.` },

  ozet: `Özetle: her çağrı bir frame kurar. Dönüş adresi ve saklı RBP yukarıda, yerel değişkenler aşağıdadır. Bu düzeni bilmek, hem decompiler çıktısını hem de güvenlik açıklarını anlamanın temelidir.`

{
  asama: 1, baslik: "Struct ve memory alignment",
  amac: `Bu derste struct alanlarının bellekte nasıl yerleştiğini, padding'in neden eklendiğini ve sizeof değerinin neden alanların toplamından büyük olabileceğini öğreneceksiniz.`,
  anlat: [
    `Her tipin bir hizalama gereksinimi vardır. Genellikle bu, tipin boyutuna eşittir: char bir, short iki, int dört, double ve pointer sekiz. Derleyici her alanı kendi hizalamasının katı olan bir ofsete yerleştirir. Bunun için alanların arasına padding adı verilen boş baytlar ekler.`,
    `Struct'ın toplam boyutu da en büyük alan hizalamasının katı olacak şekilde, sona eklenen padding ile tamamlanır. Böylece struct'lardan oluşan bir dizide her eleman doğru hizalanmış olur.`,
    `Örnek: bir char, ardından bir int, ardından bir char içeren struct'ta c sıfırıncı ofsette, i dördüncü ofsette, d sekizinci ofsette durur. Toplam boyut on iki bayttır. Aynı alanları int, char, char sırasıyla yazarsanız boyut sekize iner. Alan sırası boyutu etkiler.`,
    `__attribute__((packed)) veya #pragma pack(1) padding'i kaldırır. Ancak hizasız erişimler bazı mimarilerde yavaştır veya hata verir. Ağ protokolleri ve dosya biçimleriyle çalışırken sık kullanılır.`,
    `Tersine mühendislik bağlantısı: Ghidra'da struct tanımlarken ofsetlerde boşluk görürseniz bu genellikle padding'dir. Böyle bir boşluk, bir alanın tipi hakkında da ipucu verir. Dört baytlık bir alanın ardından dört baytlık boşluk geliyorsa, sonraki alan büyük ihtimalle sekiz baytlık bir pointer veya long'dur.`
  ],
  kodBaslik: "Örnek C kodu",
  kod: `struct A { char c; int i; char d; };

  ],

  ],
  ozet: `Özetle: derleyici alanları hizalamak için padding ekler. sizeof alanların toplamından büyük olabilir. Decompiler'da ofsetlerdeki boşluklar padding'e işaret eder.`

{
  asama: 1, baslik: "Bit işlemleri, iki tümleyen ve endianness",
  amac: `Bu derste verinin bellekte bit ve bayt düzeyinde nasıl durduğunu, negatif sayıların nasıl gösterildiğini ve x86'nın baytları hangi sırayla dizdiğini öğreneceksiniz.`,
  anlat: [
    `Bilgisayar her şeyi bit olarak saklar. Sekiz bit bir bayt eder. Onaltılık gösterim her dört biti tek bir haneyle yazar, bu yüzden bir bayt her zaman iki onaltılık hane tutar. Örneğin 0xFF, sekiz bitin hepsinin bir olduğu baytır ve işaretsiz olarak iki yüz elli beştir. Standart tipler şunlardır: uint8_t bir bayt, uint16_t iki bayt, uint32_t dört bayt, uint64_t sekiz bayt.`,
    `İşaretli tam sayılar iki tümleyen biçiminde saklanır. En yüksek bit işaret bitidir. Bir sayıyı negatif yapmak için bitleri ters çevirir ve bir eklersiniz. Sekiz bitlik işaretli aralık eksi yüz yirmi sekizden artı yüz yirmi yediye kadardır. Bütün bitleri bir olan desen, işaretli yorumda eksi birdir. Yani 0xFF aynı bit deseni olarak işaretsizde iki yüz elli beş, işaretlide eksi birdir. Bellekte tip bilgisi yoktur. Hangi yorumun kullanıldığını kod belirler ve decompiler'ın tip kararı tam olarak budur.`,
    `C'nin bit operatörleri şunlardır: ve (&), veya (|), özel veya (^), tümleyen (~), sola kaydırma (<<) ve sağa kaydırma (>>). Bir biti kurmak için veya, temizlemek için ters maske ile ve, çevirmek için özel veya kullanılır. Sola n bit kaydırmak, ikinin n'inci kuvvetiyle çarpmaktır. İşaretsiz bir sayıyı sağa kaydırmak aynı kuvvete bölmektir. Özel veya'nın iki önemli özelliği vardır: bir değerin kendisiyle özel veyası sıfırdır ve aynı anahtarla iki kez uygulanan özel veya orijinal değeri geri verir. Bu yüzden basit şifrelemede ve kayıtçı sıfırlamada çok görülür.`,
    `x86 ve x86-64 little-endian çalışır: çok baytlı bir sayının en düşük anlamlı baytı en düşük adreste durur. 0x12345678 değeri bellekte 78 56 34 12 sırasıyla yazılır. Ağ protokolleri ise geleneksel olarak big-endian kullanır, bu yüzden htonl ve ntohl gibi dönüşüm fonksiyonları vardır. Hex dump okurken sayıyı ters sırada okumayı unutursanız yanlış değer bulursunuz. Aynı şey string'ler için de geçerlidir: bellekteki ABCD baytları dört baytlık bir tam sayı olarak okunduğunda 0x44434241 çıkar.`,
    `İşaretsiz taşma kurallıdır ve sayı modüler olarak başa sarar: sekiz bitlik bir değer olan 255'e bir eklerseniz sonuç sıfır olur. İşaretli taşma ise C'de tanımsız davranıştır ve derleyici buna dayanarak optimizasyon yapabilir. Tersine mühendislik bağlantısı: and eax, 0xff alt baytı ayıklar. shr eax, 31 işaret bitini alır. xor eax, eax kayıtçıyı sıfırlar. 0x80000000 gibi sabitler işaret bitini veya en küçük işaretli sayıyı gösterir. Bu kalıpları tanıdığınızda bir fonksiyonun maske ve bayrak işlediğini hızlıca anlarsınız.`
  ],
  ek: [
    `Bit alanları: bir struct içinde unsigned int a : 3; gibi bir tanım, bir tam sayının belirli bitlerini ayırır. Derleyici bunları kaydırma ve maske işlemlerine çevirir. Decompiler çıktısında (x >> 3) & 7 gibi bir ifade görürseniz bu, üç bitlik bir alanın okunmasıdır. Dosya biçimlerinde ve protokol başlıklarında bayrak alanları çok yaygındır.`,
    `Bazı bit işlemleri için işlemcide özel komutlar vardır. popcnt bir olan bitlerin sayısını verir. bsf ve bsr ilk ve son bir olan biti bulur. tzcnt ve lzcnt sondaki ve baştaki sıfırları sayar. bswap ise bayt sırasını tersine çevirir. Bir fonksiyonda bswap görürseniz büyük ihtimalle endianness dönüşümü yapılıyordur.`
  ],
  kodBaslik: "Örnek C kodu",
  kod: `uint32_t x = 0x12345678;
unsigned char *b = (unsigned char *)&x;
printf("%02x %02x %02x %02x\\n", b[0], b[1], b[2], b[3]);  /* 78 56 34 12 */

uint8_t flags = 0;
flags |= (1 << 3);     /* 3. biti kur          -> 0x08 */
flags &= ~(1 << 3);    /* 3. biti temizle      -> 0x00 */
flags ^= 0x0F;         /* alt dört biti çevir  -> 0x0F */

int8_t  s = (int8_t)0xFF;   /* -1  */
uint8_t u = 0xFF;           /* 255 */
printf("%d %u\\n", s, u);`,

  uygulama: [
    `Yukarıdaki programı çalıştırıp kendi makinenizin little-endian olduğunu doğrulayın. Sonra aynı baytları htonl ile çevirip karşılaştırın.`,
    `Bir bayt üzerinde bit kurma, temizleme ve çevirme işlemlerini yapan üç küçük fonksiyon yazın. gcc -S -masm=intel -O2 ile derleyip hangi komutlara dönüştüklerine bakın.`,

#include <stdarg.h>

/* format özniteliği: derleyici bu fonksiyonu printf gibi denetler.
   1: format parametresinin sırası, 2: değişken argümanların başladığı sıra. */
__attribute__((format(printf, 1, 2)))
static void log_yaz(const char *fmt, ...) {
    va_list ap;
    va_start(ap, fmt);
    fputs("[LOG] ", stdout);
    vprintf(fmt, ap);          /* va_list alan varyant */
    va_end(ap);
    fputc('\\n', stdout);
}

/* Toplam: argüman sayısını ilk parametre ile açıkça veriyoruz. */
static int topla(int adet, ...) {
    va_list ap;
    va_start(ap, adet);
    int s = 0;
    for (int i = 0; i < adet; i++) s += va_arg(ap, int);
    va_end(ap);
    return s;
}

int main(int argc, char **argv) {
    log_yaz("toplam = %d", topla(3, 10, 20, 30));

    const char *girdi = argc > 1 ? argv[1] : "merhaba %x %x";

  kodBaslik: "Statik ve dinamik kütüphane üretmek, LD_PRELOAD ile puts sarmalamak",
  kod: `/* ---- ornek.c : kütüphane kodu ---- */
#include <stdio.h>
int topla(int a, int b) { return a + b; }

/* ---- ornek.h ---- */
/* int topla(int a, int b); */

/* ---- main.c : kullanan program ---- */
/* #include <stdio.h>
   #include "ornek.h"
   int main(void) { puts("merhaba"); printf("%d\\n", topla(2, 3)); return 0; } */

/* ---- sarmal.c : LD_PRELOAD ile puts'u sarmalayan KENDİ programınız için kütüphane ---- */
#define _GNU_SOURCE
#include <dlfcn.h>
#include <unistd.h>
#include <string.h>

int puts(const char *s) {
    static int (*gercek)(const char *) = NULL;
    if (!gercek) gercek = (int (*)(const char *))dlsym(RTLD_NEXT, "puts");
    write(2, "[sarmal] puts cagrildi: ", 24);   /* write: tekrar puts'a girmez */
    write(2, s, strlen(s));
    write(2, "\\n", 1);
    return gercek(s);
}

/* ---- Komutlar ----
   Statik:
     gcc -c ornek.c -o ornek.o
     ar rcs libornek.a ornek.o
     gcc main.c -L. -lornek -o main_statik        # -l, main.c'den SONRA
   Dinamik:
     gcc -fPIC -shared -Wl,-soname,libornek.so.1 -o libornek.so ornek.c
     gcc main.c -L. -lornek -Wl,-rpath,'$ORIGIN' -o main_dinamik
     ldd ./main_dinamik ; readelf -d ./main_dinamik | grep -E "NEEDED|RUNPATH|RPATH"
     LD_LIBRARY_PATH=. ./main_dinamik             # rpath yoksa gerekir
   Sarmal (kendi programında):
     gcc -fPIC -shared -o sarmal.so sarmal.c -ldl
     LD_PRELOAD=./sarmal.so ./main_dinamik
   Not: derleyici printf("...\\n") çağrısını puts'a çevirebilir; bu yüzden
   main.c'de doğrudan puts kullandık.
   Linker script: ld --verbose | less */`,

{

  amac: `Bu derste Valgrind (Memcheck) ile ASan, UBSan, MSan ve LSan araçlarının hangi hata türlerini yakaladığını, hangisini ne zaman seçeceğinizi ve verdikleri raporları nasıl okuyacağınızı öğreneceksiniz.`,
  anlat: [
    `Bellek hataları (sınır aşımı, use-after-free, sızıntı, ilklenmemiş okuma) çoğu zaman hemen çökme yaratmaz; program bir süre sonra, başka bir yerde bozulur. Bu yüzden bu hataları çalışma sırasında doğrudan yakalayan araçlar kullanılır. İki yaklaşım vardır. Valgrind (Memcheck) derlenmiş ikiliyi bir sanal işlemci üzerinde çalıştırır ve her bellek erişimini denetler; yeniden derleme gerektirmez ama program genellikle on ila elli kat yavaşlar. Sanitizer'lar ise derleyicinin koda eklediği denetimlerdir (-fsanitize=...) ve çoğunlukla yaklaşık iki ila üç kat yavaşlık getirir.`,
    `AddressSanitizer (ASan, -fsanitize=address) bellek erişim hatalarını yakalar: heap, stack ve global tamponlarda sınır aşımı, use-after-free, double free ve geçersiz free. Bir gölge bellek (shadow memory) tutar ve her erişimde ilgili baytın erişilebilir olup olmadığına bakar. Tamponların çevresine zehirli kırmızı bölgeler (redzone) koyar. LeakSanitizer (LSan) bellek sızıntılarını bulur; Linux x86-64 üzerinde ASan ile birlikte varsayılan olarak çalışır ve program çıkarken raporlar, ayrıca -fsanitize=leak ile tek başına da kullanılabilir. UBSan (-fsanitize=undefined) tanımsız davranışları yakalar: işaretli taşma, aşırı kaydırma, sıfıra bölme, hizasız erişim, bazı pointer ve dizi sınır hataları.`,
    `MemorySanitizer (MSan, -fsanitize=memory) ilklenmemiş bellekten okunan değerlere göre davranış değişikliklerini bulur. Yalnızca Clang'ta bulunur ve doğru çalışması için programın bağlı olduğu tüm kütüphanelerin de MSan ile derlenmesi gerekir, aksi halde yanlış alarm üretir. ASan ile MSan aynı derlemede birlikte kullanılamaz; ayrı derlemeler yapılır. Valgrind Memcheck ise ilklenmemiş değer kullanımını yeniden derleme olmadan bulabilir, ama stack ve global tamponlardaki sınır aşımlarını ASan kadar iyi yakalayamaz. ThreadSanitizer (TSan) ise veri yarışlarını arar.`,

    `Tersine mühendislik ve hata ayıklama bağlantısı: sanitizer'lı derlenmiş bir ikili, tanıması kolay izler taşır: __asan_report_load4, __asan_report_store8 gibi çağrılar, __asan_init, __ubsan_handle_add_overflow gibi semboller ve her bellek erişiminden önce gölge bellek hesabı (adresi kaydırıp bir ofset ekleyerek bir bayt okuma) ikilide görünür. Decompiler çıktısı bu yüzden kalabalıktır; bu denetimleri tanımak gerçek mantığı onlardan ayırmanıza yardım eder. Geliştirme sürecinde CI'da testleri ASan+UBSan ile, ayrı bir işte MSan ve TSan ile çalıştırmak, hataları üretim ortamından önce yakalamanın pratik yoludur. Fuzzing sırasında da sanitizer'lar kullanılır, çünkü fuzzer'ın girdisiyle tetiklenen sessiz bellek bozulmalarını görünür kılarlar.`

  kodBaslik: "KASITLI hatalı program: her sanitizer'ın yakaladığı hata",
  kod: `#include <stdio.h>
#include <stdlib.h>
#include <string.h>
#include <limits.h>

/* Bu program KASITLI olarak hatalıdır. Her hata, argümanla seçilir ve
   yalnızca kendi makinenizde, sanitizer'ları denemek için çalıştırılmalıdır. */

static void heap_tasma(void) {          /* ASan: heap-buffer-overflow */
    int *a = malloc(10 * sizeof(int));
    a[10] = 1;                          /* 0..9 geçerli; 10 sınır dışı */
    free(a);
}

static void use_after_free(void) {      /* ASan: heap-use-after-free */
    char *p = malloc(8);
    free(p);
    p[0] = 'x';
}

static void sizinti(void) {             /* LSan: detected memory leaks */
    char *p = malloc(100);
    p[0] = 1;                           /* free yok */
}

static void ilklenmemis(void) {         /* MSan (clang) / Valgrind */
    int x;                              /* ilklenmemiş */
    if (x > 0) puts("pozitif");
}

static void isaretli_tasma(void) {      /* UBSan: signed-integer-overflow */
    volatile int a = INT_MAX;
    int b = a + 1;
    printf("%d\\n", b);
}

int main(int argc, char **argv) {
    int hangi = argc > 1 ? atoi(argv[1]) : 0;
    switch (hangi) {
        case 1: heap_tasma(); break;
        case 2: use_after_free(); break;
        case 3: sizinti(); break;
        case 4: ilklenmemis(); break;
        case 5: isaretli_tasma(); break;
        default: puts("kullanim: ./prog 1..5");
    }
    return 0;
}

/* Derleme:
   gcc -g -fsanitize=address,undefined san.c -o san_asan     (1,2,3,5)
   clang -g -fsanitize=memory -fno-omit-frame-pointer san.c -o san_msan   (4)
   gcc -g san.c -o san_plain
   valgrind --leak-check=full ./san_plain 3

{
  asama: 2, baslik: "Aritmetik, mantık ve kaydırma komutları",
  amac: `Bu derste toplama, çarpma, bölme, mantık ve kaydırma komutlarını ve derleyicinin bunlarla ürettiği tipik kalıpları öğreneceksiniz.`,
  anlat: [
    `ADD ve SUB toplama ve çıkarma yapar. INC ve DEC bir artırır veya azaltır. NEG sayının işaretini çevirir, yani iki tümleyenini alır. Hepsi ZF, SF, OF gibi bayrakları günceller. ADC ve SBB ise önceki işlemden kalan elde bayrağını da hesaba katar ve bu sayede kayıtçıdan büyük sayılarla çok adımlı aritmetik yapılabilir.`,
    `Çarpmada IMUL işaretli çarpmadır ve en yaygın biçimi imul eax, ecx şeklindedir. Üç operandlı imul eax, ecx, 12 biçimi bir sabitle çarpar. MUL işaretsizdir ve tek operand alır: RAX ile operandı çarpıp sonucu RDX:RAX çiftine yazar. Bölmede DIV ve IDIV, RDX:RAX çiftini operanda böler. Bölüm RAX'a, kalan RDX'e yazılır. İşaretli bölmeden önce CDQ (32 bit) veya CQO (64 bit) komutuyla bölünen işaret genişletilir. İşaretsiz bölmede bunun yerine xor edx, edx görürsünüz. Sıfıra bölme işlemci istisnası üretir.`,
    `AND, OR, XOR ve NOT bitler üzerinde işlem yapar. TEST, AND gibi çalışır ama sonucu atar, yalnızca bayrakları günceller. and eax, 1 bir sayının tek veya çift olduğunu söyler. Kaydırmada SHL ve SAL sola kaydırır. SHR mantıksal sağa kaydırmadır ve soldan sıfır doldurur. SAR aritmetik sağa kaydırmadır ve işaret bitini korur. ROL ve ROR bitleri döndürür. Kaydırma miktarı bir sabit veya CL kayıtçısı olabilir. Dışarı çıkan son bit CF'ye yazılır.`,
    `Derleyiciler yavaş komutlardan kaçınır. Beş ile çarpmak için lea eax, [rdi+rdi*4] kullanılır. On ile çarpmak için bunun üstüne add eax, eax eklenir. İkinin kuvvetiyle işaretsiz bölme shr ile yapılır. İşaretli bölmede negatif sayılar için sıfıra doğru yuvarlama gerekir, bu yüzden shr eax, 31 ile işaret bitini alıp sayıya eklemek ve sonra sar kullanmak gerekir. Bu kalıbı gördüğünüzde bunun işaretli bir ikiye bölme olduğunu anlarsınız.`,
    `Tersine mühendislik bağlantısı: bir döngüde ROL veya ROR ile birlikte XOR ve ADD görüyorsanız bu çoğunlukla bir hash veya basit şifreleme algoritmasıdır. İşaretli ve işaretsiz çarpma ile bölme komutları tip bilgisi de verir: IDIV işaretli, DIV işaretsiz bir değere işaret eder. Bu ipuçlarını Ghidra'da değişken tiplerini seçerken kullanın.`
  ],
  ek: [
    `INC ve DEC elde bayrağını (CF) değiştirmez, ADD ve SUB değiştirir. Bu ince fark, bayrak okuyan kodda önemlidir. NEG komutu operand sıfırsa CF'yi sıfır yapar, aksi halde bir yapar. Bir ADD ve ardından ADC ile yüz yirmi sekiz bitlik toplama yapılabilir: alt yarılar ADD ile, üst yarılar ADC ile toplanır.`,
    `Bölmede taşma durumu: IDIV ile bölüm kayıtçıya sığmazsa işlemci sıfıra bölme gibi bir istisna üretir. Örneğin en küçük işaretli sayıyı eksi bire bölmek bu duruma yol açar. Bu hata, tersine mühendislik sırasında tuhaf çökmelerin nedeni olabilir ve güvenlik açısından da önemlidir.`
  ],
  kodBaslik: "Derleyici kalıpları",
  kod: `; x / 2  (işaretli int, x EDI'de)
mov  eax, edi
shr  eax, 31          ; işaret biti: negatifse 1
add  eax, edi         ; negatifler için düzeltme
sar  eax, 1           ; bir bit aritmetik kaydır

; x * 10
lea  eax, [rdi+rdi*4] ; eax = 5 * x
add  eax, eax         ; eax = 10 * x

; 64 bit işaretli bölme: rax / rcx
cqo                   ; RDX:RAX = RAX işaretli genişlet
idiv rcx              ; RAX = bölüm, RDX = kalan

; tek mi çift mi?
test dil, 1           ; alt bit bir ise tek
jne  .tek`,
  videolar: [
    yt("x86-64 assembly arithmetic instructions add sub imul idiv", "EN"),
    yt("x86 shift rotate instructions shl shr sar rol ror", "EN"),
    yt("assembly aritmetik komutlar", "TR")
  ],
  uygulama: [

    `İşaretli ve işaretsiz bir int bölmesinde div ile idiv arasındaki farkı gözlemleyin.`,
    `GDB'de cdq komutundan önce ve sonra EDX değerine bakın. EAX negatifken ne olduğunu gözlemleyin.`
  ],
  sorular: [
    { q: `idiv'den önce neden cdq veya cqo gerekir?`, a: `Bölünen RDX:RAX çiftindedir. İşaret genişletilmezse RDX'te çöp kalır ve sonuç yanlış olur veya istisna oluşur.` },
    { q: `shr ile sar arasındaki fark nedir?`, a: `shr soldan sıfır doldurur, sar işaret bitini korur. İşaretsiz değerlerde shr, işaretli değerlerde sar kullanılır.` }
  ],
  ozet: `Özetle: derleyici çarpmayı lea ve kaydırmayla, bölmeyi kaydırma ve sihirli sabitlerle üretir. cdq ve cqo işaretli bölmeden önce gelir. ROL ve ROR genellikle hash ve şifreleme işaretidir.`
},
{
  asama: 2, baslik: "Adresleme modları, genişletme ve REP komutları",
  amac: `Bu derste [taban + indeks*ölçek + ofset] biçimindeki bellek operandlarını, işaret ve sıfır genişletme komutlarını ve REP ile başlayan blok işlemlerini öğreneceksiniz.`,
  anlat: [
    `x86-64'te bellek operandının genel biçimi [taban + indeks*ölçek + yer değiştirme] şeklindedir. Ölçek bir, iki, dört veya sekiz olabilir. mov eax, [rdi+rsi*4+8] komutunda rdi dizinin başlangıcıdır, rsi indekstir, dört bayt eleman boyutudur, sekiz ise bir ofsettir. Dizi erişimleri, struct içindeki dizi erişimleri ve iç içe yapılar bu biçimle ifade edilir.`,
    `RIP'e göre adreslemede adres, komutun bulunduğu yere göre bir uzaklıkla hesaplanır: lea rax, [rip+0x2ee4] veya mov eax, [rip+0x2ee4]. Global değişkenlere ve string literal'lere bu şekilde erişilir ve kod konumdan bağımsız (PIE) olabilir. Ghidra bu komutların yanında hedef adresi gösterir ve çoğu zaman o adresteki veriyi etiketler.`,
    `Boyut belirsiz kaldığında BYTE PTR, WORD PTR, DWORD PTR ve QWORD PTR öneklerini görürsünüz. Bunlar bir, iki, dört ve sekiz baytlık erişimi belirtir. Boyut bir değişkenin tipinin en iyi ipucudur.`,
    `Küçük bir değeri büyük bir kayıtçıya taşırken MOVZX değeri sıfırla genişletir, MOVSX işaretle genişletir. 32 bitten 64 bite işaretli genişletme için MOVSXD kullanılır. CDQE, EAX'i işaretli olarak RAX'e genişletir. Bu komutlar tip bilgisi verir: movzx unsigned char veya unsigned short, movsx ise signed char, short veya int demektir.`,
    `Blok işlemleri için REP öneki kullanılır. rep movsb ve rep movsq bellek kopyalar: kaynak RSI'da, hedef RDI'da, sayaç RCX'tedir. rep stosb ve rep stosq belleği AL veya RAX değeriyle doldurur. repe cmpsb karşılaştırır, repne scasb bir baytı arar. Yön bayrağı DF sıfırsa işlemler ileri doğrudur. Derleyici küçük memcpy ve memset çağrılarını çoğu zaman bu komutlarla satır içi üretir, yani çağrı olarak görünmez.`
  ],
  ek: [
    `LEA yalnızca adres hesabı için değil çarpma için de kullanılır: lea eax, [rdi+rdi*2] üç kat, lea eax, [rdi*8] sekiz kat hesaplar. Ölçek yalnızca bir, iki, dört ve sekiz olabildiği için başka çarpanlar birkaç komuta bölünür. Üç çarpı sekiz gibi iki adımlı bir kalıp gördüğünüzde bu yirmi dört baytlık bir struct dizisi olabilir.`,
    `fs: ve gs: segment önekleri iş parçacığı yerel verisine erişir. Linux'ta fs:0x28 stack canary değerini verir. Windows x64'te gs:[0x60] PEB adresidir. Ghidra bunları in_FS_OFFSET gibi değişkenlerle gösterebilir. Bu öneklerin anlamını bilmek, canary okumalarını ve Windows'ta PEB üzerinden yapılan işlemleri tanımanızı kolaylaştırır.`
  ],
  kodBaslik: "Örnek assembly (Intel)",
  kod: `; int dizi[i] okumak (RDI = dizi, RSI = i)
mov   eax, DWORD PTR [rdi+rsi*4]

; 24 baytlık struct dizisi, alan ofseti 4: ptr[i].alan
lea   rax, [rsi+rsi*2]              ; rax = 3 * i
mov   eax, DWORD PTR [rdi+rax*8+4]  ; taban + (3*i)*8 + 4

; char okumak
movsx eax, BYTE PTR [rdi]           ; signed char
movzx eax, BYTE PTR [rdi]           ; unsigned char

; memset(rdi, 0, 64)
xor   eax, eax
mov   ecx, 8
rep stosq                           ; 8 * 8 = 64 bayt sıfırla`,

    `Büyük bir diziyi sıfırlayan bir memset çağrısını -O1 ve -O2 ile derleyip rep stos kullanılıp kullanılmadığına bakın.`
  ],
  sorular: [
    { q: `mov eax, [rdi+rsi*4+8] komutunda ölçek neyi gösterir?`, a: `Dizinin eleman boyutunu, yani burada dört baytlık bir int dizisini.` },
    { q: `movzx ile movsx arasındaki fark nedir?`, a: `movzx üst bitleri sıfırla doldurur, movsx işaret bitiyle doldurur. Hangisinin kullanıldığı değerin tipini ele verir.` }
  ],
  ozet: `Özetle: bellek operandı taban, indeks, ölçek ve ofsetten oluşur. movzx ve movsx tip ipucu verir. rep movs ve rep stos blok kopyalama ve doldurma işlemleridir.`

{
  asama: 2, baslik: "Kayan nokta ve SSE komutları",
  amac: `Bu derste float ve double değerlerin x86-64'te XMM kayıtçılarıyla nasıl işlendiğini ve kayan nokta kodunun decompiler çıktısında nasıl göründüğünü öğreneceksiniz.`,
  anlat: [

  kod: `#include <sys/mman.h>
#include <stdio.h>
#include <string.h>

                   MAP_PRIVATE | MAP_ANONYMOUS, -1, 0);

{

atomic_int guvenli = 0;
int guvensiz = 0;

void *is(void *a) {
    for (int i = 0; i < 1000000; i++) {
        atomic_fetch_add(&guvenli, 1);   /* lock add / lock xadd */
        guvensiz++;                      /* yarış: düz okuma-artırma-yazma */
    }
    return NULL;
}

int main(void) {
    pthread_t t1, t2;
    pthread_create(&t1, NULL, is, NULL);
    pthread_create(&t2, NULL, is, NULL);
    pthread_join(t1, NULL);

}

  kod: `#include <immintrin.h>
#include <stdio.h>

/* derleme:  gcc -O3 -fopt-info-vec simd.c -o simd
   inceleme: objdump -d -M intel simd | grep -E "paddd|vpaddd|movdqu|vmovdqu|vzeroupper" */

/* 1) düz C: -O3 ile derleyici bunu SSE2 paddd ile vektörleştirir */
int toplam_c(const int *a, int n) {
    int s = 0;
    for (int i = 0; i < n; i++) s += a[i];
    return s;
}

/* 2) intrinsics: sekiz int'i tek komutla toplar (yalnızca AVX2'li işlemcide) */
__attribute__((target("avx2")))
int toplam_avx2(const int *a, int n) {
    __m256i acc = _mm256_setzero_si256();
    int i = 0;
    for (; i + 8 <= n; i += 8) {
        __m256i v = _mm256_loadu_si256((const __m256i *)(a + i));
        acc = _mm256_add_epi32(acc, v);          /* vpaddd ymm, ymm, ymm */
    }
    int t[8];
    _mm256_storeu_si256((__m256i *)t, acc);
    int s = 0;
    for (int k = 0; k < 8; k++) s += t[k];       /* yatay toplama */
    for (; i < n; i++) s += a[i];                /* artakalan elemanlar */
    return s;
}

int main(void) {
    int veri[1003];
    for (int i = 0; i < 1003; i++) veri[i] = i % 10;
    printf("c    : %d\\n", toplam_c(veri, 1003));
    if (__builtin_cpu_supports("avx2"))
        printf("avx2 : %d\\n", toplam_avx2(veri, 1003));
    else
        printf("bu işlemcide AVX2 yok\\n");
    return 0;
}`,

  kod: `#include <stdio.h>
#include <stdint.h>
#include <signal.h>
#include <setjmp.h>

/* 64 bit modda bir IDT girdisi (kesme kapısı tanımlayıcısı), 16 bayt */
struct __attribute__((packed)) idt_girdisi {
    uint16_t ofset_alt;     /* işleyici adresinin bit 0-15  */
    uint16_t secici;        /* kod segmenti seçicisi         */
    uint8_t  ist;           /* alt 3 bit: IST indeksi        */
    uint8_t  tur_ozellik;   /* tür, DPL ve mevcut biti       */
    uint16_t ofset_orta;    /* bit 16-31                     */
    uint32_t ofset_ust;     /* bit 32-63                     */
    uint32_t ayrilmis;
};

static sigjmp_buf donus;
static volatile int son_sinyal;
static void *volatile son_adres;

static void yakala(int sig, siginfo_t *si, void *baglam) {
    (void)baglam;
    son_sinyal = sig;
    son_adres = si->si_addr;
    siglongjmp(donus, 1);
}

static void dene(const char *ad, int tur) {
    son_sinyal = 0;
    if (sigsetjmp(donus, 1) == 0) {
        volatile int sifir = 0;
        volatile int *p = NULL;
        if (tur == 0) *p = 1;                       /* #PF  -> SIGSEGV */
        else if (tur == 1) sifir = 10 / sifir;      /* #DE  -> SIGFPE  */
        else __asm__ __volatile__("int3");          /* #BP  -> SIGTRAP */
    }
    printf("%-14s -> sinyal %d, adres %p\\n", ad, son_sinyal, son_adres);
}

int main(void) {
    printf("IDT girdisi boyutu: %zu bayt\\n", sizeof(struct idt_girdisi));
    struct sigaction sa = {0};
    sa.sa_sigaction = yakala;
    sa.sa_flags = SA_SIGINFO;
    sigemptyset(&sa.sa_mask);
    sigaction(SIGSEGV, &sa, NULL);
    sigaction(SIGFPE, &sa, NULL);
    sigaction(SIGTRAP, &sa, NULL);
    dene("NULL'a yazma", 0);
    dene("sifira bolme", 1);
    dene("int3", 2);
    return 0;
}

  kod: `#define _GNU_SOURCE
#include <pthread.h>
#include <stdio.h>
#include <time.h>

#define TUR 50000000L

/* a ve b aynı 64 baytlık satıra düşer */
struct bitisik { volatile long a; volatile long b; };
/* her biri kendi satırında */
struct ayri { _Alignas(64) volatile long a; _Alignas(64) volatile long b; };

static struct bitisik B;
static struct ayri A;

static void *artir(void *p) {
    volatile long *sayac = p;
    for (long i = 0; i < TUR; i++) (*sayac)++;
    return NULL;
}

static double saniye(void) {
    struct timespec t;
    clock_gettime(CLOCK_MONOTONIC, &t);
    return t.tv_sec + t.tv_nsec / 1e9;
}

static void calistir(const char *ad, volatile long *x, volatile long *y) {
    pthread_t t1, t2;
    double bas = saniye();
    pthread_create(&t1, NULL, artir, (void *)x);
    pthread_create(&t2, NULL, artir, (void *)y);
    pthread_join(t1, NULL);
    pthread_join(t2, NULL);
    printf("%-10s: %.3f sn\\n", ad, saniye() - bas);
}

int main(void) {
    calistir("bitisik", &B.a, &B.b);   /* genellikle belirgin biçimde yavaş */
    calistir("ayri", &A.a, &A.b);
    return 0;
}

#include <stdio.h>

                                        /* bir relocation (tür sürüme bağlıdır) */

int main(void) {

}

  asama: 2, baslik: "Satır içi assembly: asm volatile ve GCC kısıtları",
  amac: `Bu derste GCC genişletilmiş asm sözdizimini, çıktı ve girdi kısıtlarını, clobber listesini, rdtsc, cpuid ve syscall için tipik kullanımları ve satır içi assembly'nin decompiler'da nasıl göründüğünü öğreneceksiniz.`,
  anlat: [
    `C kodunun içine doğrudan assembly yazmak gerekebilir: işlemciye özgü komutlar (rdtsc, cpuid), sistem çağrıları veya derleyicinin üretemediği kalıplar için. GCC bunun için genişletilmiş asm sözdizimini sunar: asm volatile ("şablon" : çıktılar : girdiler : clobber listesi). Şablon komut metnidir ve varsayılan olarak AT&T sözdizimindedir. Katı C modunda (-std=c11) asm anahtar sözcüğü yerine __asm__ yazmak gerekir. Derleyici şablonun içini anlamaz, yalnızca metni üretilen assembly'ye yerleştirir. Bu yüzden derleyiciye, kodun hangi kayıtçıları ve belleği kullandığını doğru anlatmak yazarın sorumluluğundadır.`,
    `Kısıtlar (constraints) değişkenlerin nerede duracağını belirler. "r" herhangi bir genel kayıtçı, "m" bellek operandı, "i" anlık sabit demektir. x86'ya özgü harfler belirli kayıtçıları ister: "a" RAX, "b" RBX, "c" RCX, "d" RDX, "S" RSI, "D" RDI. Çıktı kısıtları "=" ile başlar ve salt yazılır olduğunu belirtir, "+" hem okunan hem yazılan operanddır. "&" erken clobber işaretidir ve çıktının girdilerle aynı kayıtçıya konmamasını sağlar. Şablonda operandlara %0, %1 diye başvurulur ve gerçek kayıtçı adı yazmak için %% kullanılır. Örneğin %%rax yazmak gerekir.`,

  kodBaslik: "rdtsc, cpuid, syscall ve toplama için satır içi assembly",
  kod: `#include <stdio.h>
#include <stdint.h>
#include <string.h>

/* derleme: gcc -O2 satir_ici.c -o satir_ici
   inceleme: objdump -d -M intel satir_ici | grep -E "rdtsc|cpuid|syscall" */

static inline uint64_t tsc_oku(void) {
    uint32_t alt, ust;
    __asm__ __volatile__("rdtsc" : "=a"(alt), "=d"(ust));   /* EDX:EAX */
    return ((uint64_t)ust << 32) | alt;
}

static void cpuid(uint32_t yaprak, uint32_t alt_yaprak, uint32_t r[4]) {
    __asm__ __volatile__("cpuid"
        : "=a"(r[0]), "=b"(r[1]), "=c"(r[2]), "=d"(r[3])
        : "a"(yaprak), "c"(alt_yaprak));
}

/* write(fd, tampon, n): 64 bit Linux'ta syscall numarası 1 */
static long yaz(int fd, const void *tampon, unsigned long n) {
    long ret;
    __asm__ __volatile__("syscall"
        : "=a"(ret)
        : "a"(1), "D"(fd), "S"(tampon), "d"(n)
        : "rcx", "r11", "memory");          /* syscall bu ikisini bozar */
    return ret;
}

/* girdi/çıktı kısıtı örneği: a = a + b */
static int topla(int a, int b) {
    __asm__("addl %1, %0" : "+r"(a) : "r"(b) : "cc");
    return a;
}

int main(void) {
    uint32_t r[4];
    cpuid(0, 0, r);
    char uretici[13];
    memcpy(uretici + 0, &r[1], 4);          /* EBX */
    memcpy(uretici + 4, &r[3], 4);          /* EDX */
    memcpy(uretici + 8, &r[2], 4);          /* ECX */
    uretici[12] = 0;
    printf("üretici: %s\\n", uretici);

    uint64_t t0 = tsc_oku();
    yaz(1, "merhaba\\n", 8);
    uint64_t t1 = tsc_oku();
    printf("yaz için yaklaşık %llu TSC adımı\\n", (unsigned long long)(t1 - t0));
    printf("topla(3,4) = %d\\n", topla(3, 4));
    return 0;
}`,

# long topla(long a, long b) { return a + b; }
topla:
    add   a0, a0, a1          # a0 = a0 + a1
    ret                       # jalr x0, 0(ra)

# başka fonksiyon çağıran bir fonksiyonun çerçevesi

    call  baska               # auipc + jalr
    ld    ra, 8(sp)

    ret

# write(1, msg, 6)

    li    a0, 1
    la    a1, msg
    li    a2, 6
    ecall

# ---------- MIPS O32 ----------
# int topla(int a, int b) { return a + b; }
topla:

{
  asama: 2, baslik: "Donanım tabanlı kontrol akışı korumaları: CET, PAC ve BTI",
  amac: `Bu derste Intel CET (shadow stack ve endbr64/IBT), ARM PAC ve BTI korumalarının ne yaptığını, stack canary ile farkını, ikilide nasıl tanındıklarını ve analiz sırasında neyi değiştirdiklerini öğreneceksiniz.`,
  anlat: [
    `Bellek bozulması açıkları, saldırganın dönüş adresini veya fonksiyon işaretçisini değiştirerek kontrol akışını yönlendirmesine yol açabilir. Önceki derslerdeki NX, ASLR ve canary bu riski azaltır, ama yazılım tabanlıdır. Donanım tabanlı korumalar ise aynı sorunu işlemci komutlarıyla sınırlar. Kontrol akışı bütünlüğü iki yönden düşünülür: geri kenar (backward edge) fonksiyondan dönüşü, ileri kenar (forward edge) ise dolaylı çağrı ve atlamaları ifade eder. Bu ders, bu korumaları savunma açısından anlamayı ve ikilide tanımayı amaçlar, saldırı yöntemlerini değil.`,
    `Intel CET iki parçadan oluşur. Shadow stack, yalnızca dönüş adreslerini tutan ayrı, yazma korumalı bir yığındır. call komutu dönüş adresini hem normal yığına hem shadow stack'e yazar. ret komutu ise iki değeri karşılaştırır ve uyuşmazlık varsa kontrol koruması istisnası (#CP) oluşur. Böylece normal yığındaki dönüş adresi bozulsa bile program ele geçirilemez. İkinci parça IBT'dir (Indirect Branch Tracking): etkin olduğunda call rax veya jmp [rax] gibi dolaylı bir dalın hedefi endbr64 (F3 0F 1E FA) komutu olmak zorundadır, aksi halde yine #CP oluşur. Eski işlemcilerde endbr64 bir nop gibi davranır, bu yüzden korumalı ikililer korumasız işlemcilerde de çalışır. GCC bunu -fcf-protection ile ekler ve bazı dağıtımlarda varsayılandır. Linux'ta kullanıcı alanı shadow stack desteği için yeterince yeni çekirdek ve glibc gerekir, sürüme göre değişir.`,
    `ARM64 tarafında iki benzer mekanizma vardır. PAC (Pointer Authentication), bir işaretçinin kullanılmayan üst bitlerine kriptografik bir imza (PAC) ekler. paciasp komutu lr'yi sp'yi bağlam olarak kullanarak imzalar, autiasp ise dönmeden önce imzayı doğrular. İmza tutmazsa işaretçi geçersiz hâle gelir ve kullanıldığında hata oluşur. retaa gibi komutlar doğrulamayı ve dönüşü birleştirir. BTI (Branch Target Identification) ise IBT'nin karşılığıdır: dolaylı dal hedeflerinde bti c, bti j veya bti jc komutu aranır. paciasp komutu da geçerli bir bti c hedefi sayılır. GCC ve Clang bunu -mbranch-protection=standard ile üretir. Bu komutlar eski çekirdeklerde nop gibi davrandığı için geriye uyumludur.`,
    `Stack canary ile karşılaştıralım. Canary, derleyicinin yerel değişkenlerle dönüş adresi arasına koyduğu rastgele bir değerdir (x86-64 Linux'ta fs:0x28'den okunur) ve fonksiyon çıkışında kontrol edilir, bozulmuşsa __stack_chk_fail çağrılır. Doğrusal taşmaları yakalar, ama değer sızdırılırsa veya taşma canary'ye dokunmadan başka bir hedefe yazarsa işe yaramaz. Shadow stack ve PAC ise dönüş adresinin kendisini korur ve rastgele bir yazma ile normal yığın değiştirilse bile bozulma fark edilir. IBT ve BTI hedef kümesini daraltır, ama izin verilen hedefler arasındaki yönlendirmeyi engellemez. Bu yüzden bu korumalar birbirinin yerine değil, birbirini tamamlayan katmanlardır ve ASLR ile NX'in yanında çalışır.`,

  kodBaslik: "Korumaları açıp ikilide tanımak",
  kod: `/* koruma.c */
#include <stdio.h>
#include <string.h>

static void selam(const char *s) {
    char tampon[16];                          /* yerel dizi -> canary eklenir */
    strncpy(tampon, s, sizeof tampon - 1);
    tampon[sizeof tampon - 1] = 0;
    printf("%s\\n", tampon);
}

static void (*islem)(const char *) = selam;   /* dolaylı çağrı -> IBT hedefi */

int main(int argc, char **argv) {
    islem(argc > 1 ? argv[1] : "merhaba");
    return 0;
}

   gcc -O1 -fcf-protection=full -fstack-protector-strong koruma.c -o koruma

  anlat: [
    `Linux ve macOS'taki C++ derleyicileri istisna işleme için Itanium C++ ABI'yi kullanır. throw ifadesi arka planda __cxa_allocate_exception ile istisna nesnesi için yer ayırır, nesneyi oluşturur ve __cxa_throw'u çağırır. Bu fonksiyon istisna nesnesini, tür bilgisini (typeinfo) ve yıkıcıyı alır, geri sarma (unwinding) işlemini başlatır ve geri dönmez. Çıktıda __cxa_throw görmek, o noktada bir istisna fırlatıldığının kesin işaretidir. Typeinfo argümanı size hangi türün fırlatıldığını söyler.`,
    `Geri sarma çalışma zamanında tablolarla yapılır, kodda ek bir maliyet yoktur (zero-cost). .eh_frame bölümü her fonksiyon için sarma bilgisini (CFI) tutar: stack'in ve kayıtçıların her komut noktasında nasıl geri yüklenebileceğini söyler. .gcc_except_table bölümü ise LSDA verisini taşır: hangi komut aralığının try bloğunda olduğunu, hangi landing pad'e (catch veya temizleme kodu) gidileceğini ve hangi türlerin yakalandığını içerir. Kişilik fonksiyonu __gxx_personality_v0 bu tabloları okur. catch bloğunun başında __cxa_begin_catch, sonunda __cxa_end_catch, temizlemeden sonra yeniden sarma için _Unwind_Resume çağrılır. Bu çağrıları gördüğünüzde catch ve cleanup kodunu tanırsınız. Landing pad'ler normal akışta hiçbir yerden çağrılmaz, bu yüzden decompiler'da ulaşılamaz kod gibi görünebilir.`,
    `STL tipleri bellekte standart kütüphane uygulamasına göre görünür, aşağıdakiler libstdc++ (GCC) içindir ve libc++ farklıdır. std::string 32 bayttır: bir veri pointer'ı, bir uzunluk ve kısa string'ler için 16 baytlık yerel tampon ile kapasite alanından oluşan bir birlik. Metin 15 karaktere kadarsa tampon nesnenin içinde kalır ve pointer kendi içindeki tamponu gösterir (SSO). std::vector 24 bayttır ve üç pointer tutar: başlangıç, kullanılan sonu ve kapasite sonu. Eleman sayısı (bitiş eksi başlangıç) bölü eleman boyutudur ve decompiler'da bu bölme genellikle kaydırma olarak görünür.`,
    `std::map ve std::set libstdc++'ta kırmızı-siyah ağaçtır. Her düğüm renk bilgisi, ebeveyn, sol ve sağ pointer'lardan oluşan bir tabanla başlar ve değer bunun hemen ardından gelir. Haritanın kendisi karşılaştırıcı, bir başlık düğümü ve düğüm sayısını tutar. Kodda _Rb_tree_insert_and_rebalance veya _Rb_tree_increment gibi sembollerle bu yapıyı tanırsınız. Şablonlar her tür kombinasyonu için ayrı kod üretir, bu yüzden aynı mantıkta çok sayıda kopya görürsünüz. İsim bozma bu kopyaları ayırt eder: _ZNSt6vectorIiSaIiEE9push_backERKi adı std::vector<int, std::allocator<int> >::push_back(int const&) olarak çözülür. c++filt komutu ve Ghidra bu çözümü yapar.`,
    `Ghidra'da bu bilgiyi kullanmak için struct'lar tanımlayın. Data Type Manager'da string, vector ve düğüm yapılarını elle oluşturabilir ya da bir C başlığı yazıp Ghidra'nın C kaynağı ayrıştırma özelliğiyle içe aktarabilirsiniz (menü adı sürüme göre değişir). Sonra fonksiyon parametrelerini ve yerel değişkenleri bu tiplere çevirirseniz çıktı param_1[1] yerine v.size gibi okunur. Çıkış işlemi için istisna tabloları da değerli bir veridir: bir fonksiyonun hangi türleri yakaladığını LSDA'dan okuyarak programın hata işleme yapısını anlayabilirsiniz. STL düzeni derleyici ve sürüme göre değiştiği için önce küçük bir test programını kendi derleyicinizle çözmek güvenli bir yoldur.`
  ],
  kodBaslik: "Örnek C++ ve inceleme komutları",
  kod: `// ornek.cpp

#include <map>
#include <stdexcept>

int isle(int x) {
    if (x < 0) throw std::runtime_error("negatif");

}
int main() {
    std::string s = "kisa";            // SSO: tampon nesne içinde
    std::vector<int> v = {1, 2, 3};

$ g++ -O0 -g -o ornek ornek.cpp

    `FLIRT, IDA'nın kullandığı bir imza sistemidir. Bir kütüphane fonksiyonunun ilk baytları (adres ve ofset gibi değişen kısımlar maskelenerek) ve bir sağlama toplamı imza olarak saklanır. IDA, kendi araçlarıyla (FLAIR paketi) kütüphane dosyalarından imza üretebilir ve ikili dosyadaki fonksiyonları bu imzalarla eşleştirip adlandırır. Ghidra'nın Function ID (FID) özelliği benzer bir iş yapar: veritabanları (.fidb) hazır kütüphane derlemelerinden üretilir ve ikilideki fonksiyonlar bu veritabanıyla karşılaştırılır. Ghidra ile gelen hazır veritabanları ağırlıklı olarak belirli derleyicilerin kütüphanelerini kapsar. Kendi kütüphanenizi tanıtmak için aynı kütüphaneyi aynı derleyici ve bayraklarla derleyip bir veritabanı oluşturursunuz. Menü adları sürüme göre değişir, bu yüzden Ghidra belgelerine bakın.`,
    `BSim, Ghidra'nın benzerlik tabanlı arama özelliğidir. İmzaların tam eşleşme gerektirmesine karşılık BSim, decompiler çıktısından özellikler çıkarıp fonksiyonların anlamsal benzerliğini ölçer. Bu sayede farklı derleyici ayarlarıyla veya küçük değişikliklerle derlenmiş aynı fonksiyonları da bulabilir. Fonksiyonlar bir veritabanında saklanır ve yeni bir ikilideki fonksiyonlar bu veritabanında sorgulanır. Kurulumu bir veritabanı sunucusu gerektirir ve arka uç seçenekleri sürüme göre değişir.`,
    `YARA, dosyaları metin ve bayt kalıplarıyla tanımlamak için kullanılan bir kural dilidir. Bir kural adı, isteğe bağlı meta bilgisi, strings bölümünde tanımlanan kalıplar ve bir condition ifadesinden oluşur. Kalıp metin olabilir (ascii ve wide değiştiricileriyle), süslü parantezle yazılan hex dizisi olabilir ve içinde ?? joker karakterleri veya [1-4] gibi atlama aralıkları bulunabilir. Koşul bu kalıpların nasıl birleşeceğini belirtir. Örneğin uint32(0) ile dosyanın başındaki sihirli sayıyı, filesize ile boyutu, any of them ile herhangi bir kalıbı kontrol edebilirsiniz. İyi bir kural hem az yanlış pozitif hem az yanlış negatif üretir. Bu yüzden değişmeyecek, ayırt edici kalıpları seçmelisiniz.`,
    `Kendi imzanızı üretmek için önce kendi kütüphanenizi ya da bir demo programı derleyin. Disassembly'de adres ve ofset içeren baytları joker yapın, fonksiyonun ayırt edici özelliklerini (özgün string'ler, sabitler, bayt dizisi) belirleyin ve bunları bir YARA kuralına yazın. Kuralı hem hedef dosyada hem de farklı yazılımlarda test ederek yanlış pozitifleri ölçün. Kuralı yalnızca kendi yazdığınız örneklerde, izinli veri kümelerinde veya savunma amacıyla topladığınız örneklerde deneyin. Başkasının yazılımının korumasını aşmak için imza kullanmak bu dersin kapsamı dışındadır.`

        // hex deseni: ?? bilinmeyen bayt, [1-4] 1 ile 4 bayt arasi atlama

  kod: `# uret.py : basit bir arşiv biçimi ("LLA1") yazar
import struct

dosyalar = [("a.txt", b"merhaba"), ("b.txt", b"ikinci dosya")]
veri = b""
dizin = []
BASLIK = 4 + 1 + 2 + 4            # magic, surum, sayi, dizin_ofset
ofs = BASLIK
for ad, icerik in dosyalar:
    dizin.append((ad.encode(), ofs, len(icerik)))
    veri += icerik
    ofs += len(icerik)
dizin_ofset = ofs

cikti = b"LLA1" + struct.pack("<BHI", 1, len(dosyalar), dizin_ofset) + veri
for ad, o, b in dizin:
    cikti += struct.pack("<B", len(ad)) + ad + struct.pack("<II", o, b)
open("ornek.lla", "wb").write(cikti)

# lla.ksy : Kaitai Struct tanımı
meta:
  id: lla_arsiv
  endian: le
seq:
  - id: magic
    contents: "LLA1"
  - id: surum
    type: u1
  - id: kayit_sayisi
    type: u2
  - id: dizin_ofset
    type: u4
instances:
  dizin:
    pos: dizin_ofset
    type: girdi
    repeat: expr
    repeat-expr: kayit_sayisi
types:
  girdi:
    seq:
      - id: ad_uzunluk
        type: u1
      - id: ad
        type: str
        size: ad_uzunluk
        encoding: UTF-8
      - id: ofset
        type: u4
      - id: boyut
        type: u4
    instances:
      icerik:
        pos: ofset
        size: boyut

  anlat: [

    `Temel macOS araçları şunlardır. otool -h header'ı, otool -l load command'ları, otool -L bağlı kütüphaneleri, otool -tv ise kodu disassemble eder. lipo -info bir fat dosyanın mimarilerini listeler ve lipo -thin arm64 -output ile tek bir mimariyi ayırır. codesign -dv imza bilgisini gösterir, codesign -d --entitlements - ise yetkileri yazdırır. Bu araçlar yalnızca inceleme içindir ve imzaları kaldırmak ya da başkasının korumasını aşmak bu dersin konusu değildir. Ghidra Mach-O dosyalarını doğrudan yükler. Fat dosyada hangi mimarinin yükleneceğini seçmeniz istenebilir, bu davranış sürüme göre değişir. Emin olmadığınızda önce lipo ile ayırıp tek mimarili dosyayı açın. macOS'ta çalışmıyorsanız bu araçların LLVM sürümlerini (llvm-objdump, llvm-otool vb.) Linux'ta kullanabilirsiniz.`

    `connect ve bind çağrılarına verilen adres bir sockaddr_in yapısıdır. Boyutu on altı bayttır: iki bayt adres ailesi (IPv4 için 2), iki bayt port, dört bayt IP adresi ve sekiz bayt padding. Port ve IP adresi ağ bayt sırasında, yani big-endian saklanır. Bu yüzden x86'da assembly'de port numarasının ters yazılmış göründüğünü fark edersiniz. 8080 sayısı 0x1F90'dır ve htons uygulandığında 16 bitlik bir sabit olarak 0x901F görünür. 127.0.0.1 adresi ise 32 bitlik bir sabit olarak 0x0100007F görünür. Bu iki sabit, bir programın nereye bağlandığını bulmanın hızlı yoludur.`,

# Mesaj: 1 bayt tür + 2 bayt uzunluk (big-endian) + veri
import socket, struct

s = socket.socket()
s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
s.bind(("127.0.0.1", 8080))
s.listen(1)
c, _ = s.accept()
baslik = c.recv(3)                     # gerçekte döngüyle tam 3 bayt okunmalı
tur, uzunluk = struct.unpack(">BH", baslik)
veri = c.recv(uzunluk)
print(tur, veri)

# istemci.py
import socket, struct
c = socket.create_connection(("127.0.0.1", 8080))
mesaj = b"selam"
c.sendall(struct.pack(">BH", 1, len(mesaj)) + mesaj)

{
  asama: 4, baslik: "Heap ve format string hatalarına karşı savunmalar",
  amac: `Bu derste heap bozulmalarını ve format string hatalarını zorlaştıran allocator kontrollerini, FORTIFY_SOURCE ve derleyici uyarılarını, sertleştirilmiş derleme bayraklarını ve checksec ile bir ikilinin korumalarını denetlemeyi öğreneceksiniz.`,
  anlat: [
    `Heap hataları (taşma, use-after-free, double free) belleği yöneten allocator'ın iç veri yapılarını bozabildiği için ciddi sonuçlar doğurur. glibc bu yüzden yıllar içinde bütünlük kontrolleri ekledi. Örneğin free sırasında işaretçinin hizalaması ve parça boyutu doğrulanır, tcache'e aynı parçanın ikinci kez konması bir anahtar değeriyle yakalanır ve program "free(): double free detected in tcache 2" gibi bir iletiyle abort eder. Bu iletileri görmek, kendi kodunuzda bir bellek yönetimi hatası olduğunun güçlü bir işaretidir.`,
    `glibc 2.32 ile gelen safe-linking, tek yönlü bağlı listelerdeki (tcache ve fastbin) ileri işaretçileri açık yazmak yerine, işaretçinin saklandığı adresin kaydırılmış değeriyle XOR'layarak saklar. Böylece heap'e yazma imkanı olan biri, listedeki bir sonraki adresi kolayca öngöremez ve işaretçilerin hizalaması da ayrıca denetlenir. Alternatif allocator'lar daha da ileri gider: Scudo (LLVM projesi, Android'de kullanılır) parçalara sağlama toplamlı başlık koyar, serbest bırakılan belleği karantinaya alabilir ve rastgeleleştirme uygular. GrapheneOS'un hardened_malloc'u ise metadata'yı ayrı tutar, korumalı sayfalar ve serbest bırakılmış belleği temizleme gibi önlemler kullanır. Bunlar hatayı ortadan kaldırmaz, ama sömürülmesini pahalılaştırır ve çoğu zaman hatayı hemen çökmeyle görünür kılar.`,
    `Format string hatası, kullanıcıdan gelen verinin printf ailesine biçim dizgisi olarak verilmesiyle oluşur: printf(girdi) yerine printf("%s", girdi) yazmak gerekir. Biçim belirteçleri bellekten veri okutabildiği, %n ise yazma yapabildiği için bu hata hem bilgi sızıntısına hem bellek bozmaya yol açabilir. Derleyici bunu statik olarak yakalar: -Wformat -Wformat-security uyarısı sabit olmayan bir biçim dizgisini işaretler, -Werror=format-security ise bunu derleme hatasına çevirir. Debian ve Ubuntu gibi dağıtımlar paketleri varsayılan olarak bu bayrakla derler.`,
    `FORTIFY_SOURCE, glibc'nin bazı fonksiyonlarını (memcpy, strcpy, sprintf, read gibi) derleme zamanında hedef tampon boyutu biliniyorsa denetimli sürümlerle değiştirir. Taşma tespit edilirse program "buffer overflow detected" iletisiyle sonlanır. Düzey 2'de ayrıca %n içeren biçim dizgilerinin yazılabilir bellekte bulunması reddedilir. Düzey 3 (GCC 12 ve üstü, glibc 2.34 ve üstü ile) boyutu yalnızca derleme zamanında bilinen değil, çalışma zamanında hesaplanabilen durumlara da denetim ekler ve biraz daha maliyetlidir. FORTIFY_SOURCE'un çalışması için optimizasyonun açık olması (-O1 veya üstü) gerekir, aksi halde sessizce etkisiz kalır.`,
    `Pratikte bir proje için sertleştirilmiş bayrak kümesi belirleyip derleme sistemine koymak en iyi savunmadır: -O2, -D_FORTIFY_SOURCE=2 (veya 3), -fstack-protector-strong, -fPIE -pie, -Wl,-z,relro,-z,now, -Wformat -Wformat-security -Werror=format-security ve -fstack-clash-protection. Sonra checksec ile ürettiğiniz ikiliyi denetleyin: RELRO, canary, NX, PIE ve FORTIFY sütunları beklediğiniz gibi mi? Bu denetimi CI sürecine ekleyin ki bir bayrak yanlışlıkla düşerse fark edin. Unutmayın ki bu korumalar bir güvenlik ağıdır, asıl çözüm hatayı kaynakta düzeltmektir, bunun için de ASan ve fuzzing ile test etmeniz gerekir.`
  ],
  kodBaslik: "Sertleştirilmiş derleme ve denetim",
  kod: `/* test.c: kendi test kodunuz. Güvenli sürüm ve uyarı gösteren sürüm */
#include <stdio.h>
#include <string.h>

int main(int argc, char **argv) {
    char buf[16];
    if (argc < 2) return 1;

    /* KÖTÜ: sabit olmayan biçim dizgisi. -Wformat-security uyarır:
       printf(argv[1]);                                            */

    printf("%s\\n", argv[1]);          /* DOĞRU: biçim dizgisi sabit */

    /* snprintf boyut sınırı koyar, FORTIFY de taşmayı denetler */
    snprintf(buf, sizeof buf, "%s", argv[1]);
    printf("kopya: %s\\n", buf);
    return 0;
}

/* Sertleştirilmiş derleme:
   gcc -O2 -D_FORTIFY_SOURCE=3 -fstack-protector-strong -fstack-clash-protection \\
       -fPIE -pie -Wl,-z,relro,-z,now \\
       -Wall -Wformat=2 -Wformat-security -Werror=format-security test.c -o test

   Denetim:
   checksec --file=./test
   readelf -lW ./test | grep -E "GNU_RELRO|GNU_STACK"
   readelf -d ./test | grep -E "BIND_NOW|FLAGS"
   nm -D ./test | grep -E "_chk|stack_chk"     # __snprintf_chk, __stack_chk_fail izleri */`,
  videolar: [

  ],

{
  asama: 4, baslik: "Kontrol akışı bütünlüğü ve ROP'a karşı savunma",
  amac: `Bu derste kod yeniden kullanım saldırılarının (ROP) kavramsal mantığını ve onlara karşı kullanılan CFI, shadow stack, IBT, ASLR ve RELRO katmanlarını, ayrıca bir ikilideki sertleştirmeyi nasıl denetleyeceğinizi öğreneceksiniz.`,
  anlat: [
    `NX/DEP veri sayfalarının çalıştırılmasını engelleyince saldırganlar yeni kod enjekte etmek yerine programın ve kütüphanelerin içinde zaten bulunan küçük kod parçalarını yeniden kullanma yoluna gitti. Return-oriented programming (ROP) bu fikrin adıdır: ret ile biten kısa komut dizileri (gadget) bellekteki bir dönüş adresi dizisiyle art arda çalıştırılır. Bu derste hiçbir zincir kurmayacağız, çünkü amaç saldırıyı yapmak değil, neden işe yaradığını anlayıp ona karşı hangi önlemlerin bulunduğunu bilmektir. Temel nokta şudur: saldırı, programın kontrol akışının (hangi koddan sonra hangisinin çalışacağının) bozulabilmesine dayanır.`,
    `Savunma yaklaşımı ikiye ayrılır. Birincisi, kontrol akışını bozacak hatayı baştan önlemek: bellek güvenli diller, sanitizer'lar, canary ve fuzzing. İkincisi, hata yine de varsa bozulmuş bir kontrol akışının çalışmasını engellemek: kontrol akışı bütünlüğü (CFI). CFI, her dolaylı atlamanın veya çağrının yalnızca meşru hedeflere gitmesini zorunlu kılar. Çalışma anında hedef beklenen kümede değilse program kontrollü biçimde sonlanır.`,
    `Clang'ta -fsanitize=cfi bu işi yapar ve -flto ile -fvisibility=hidden gerektirir, çünkü derleyicinin bütün program türlerini görmesi lazımdır. cfi-icall dolaylı çağrılarda fonksiyon işaretçisinin türünü, cfi-vcall ve benzerleri C++ sanal çağrılarında sınıf hiyerarşisini denetler. Yanlış türde bir fonksiyon işaretçisiyle çağrı yapıldığında program çöker, bu aynı zamanda gerçek bir tür hatasını da ortaya çıkarır. Donanım tarafında Intel CET iki parçadır: gölge yığın (shadow stack) dönüş adreslerinin ikinci bir salt okunur kopyasını tutup ret anında karşılaştırır, IBT ise dolaylı atlamaların yalnızca endbr64 komutuna inmesini şart koşar. ARM64'te benzer amaçla işaretçi doğrulama kodları (PAC) ve BTI vardır, bunlar -mbranch-protection=standard ile açılır.`,
    `Katmanlar birbirini tamamlar. ASLR ve PIE adresleri tahmin edilemez kılar, RELRO ve -z now GOT'un üzerine yazılmasını önler, canary yığın taşmalarını yakalar, shadow stack ve CFI ise dönüş ve dolaylı çağrı akışını doğrular. Hiçbiri tek başına yeterli değildir, çünkü her biri belirli bir saldırı adımını zorlaştırır. Bir ikilide bu katmanların hangilerinin açık olduğunu görmek bu yüzden bir denetim becerisidir. Örneğin -fcf-protection=full ile derlenmiş bir programın başlangıç noktalarında endbr64 komutları ve ELF notlarında IBT ile SHSTK özellik işaretleri görürsünüz.`,
    `Bir ikilideki gadget yoğunluğu, yani ret ile biten kısa dizilerin çokluğu, kaba bir risk göstergesi olarak ölçülebilir, ama tek başına anlamlı değildir: büyük ve statik bağlı bir ikili doğal olarak daha fazla gadget barındırır. Savunma açısından daha anlamlı olan, gereksiz kütüphaneleri çıkarmak, ikilileri küçültmek, statik bağlamayı gerekmedikçe kullanmamak ve yukarıdaki korumaların hepsini açmaktır. Kendi projenizde derleme ardından bir denetim betiği çalıştırın: PIE, RELRO tam, canary, NX, CET işaretleri ve ikili boyutu. Çekirdek ve glibc desteği sürüme göre değiştiği için shadow stack'in gerçekten etkin olup olmadığını hedef sistemde ayrıca doğrulayın.`
  ],
  kodBaslik: "CFI ihlalini kendi test kodunuzda gözlemlemek ve ikili denetimi",
  kod: `/* cfi_test.c: kasıtlı tür uyuşmazlığı olan KENDİ test kodunuz */
#include <stdio.h>

static int topla(int a, int b) { return a + b; }

int main(void) {
    /* Gerçek tür: int(*)(int,int). Burada yanlış türle çağırıyoruz.
       CFI açıkken bu dolaylı çağrı çalışma anında yakalanır. */
    void (*fp)(void) = (void (*)(void))topla;
    fp();                    /* cfi-icall ihlali: program kontrollü sonlanır */
    puts("buraya gelinmemeli");
    return 0;
}

/* Derleme (clang, LTO ve gizli görünürlük şart):
   clang -O1 -flto -fvisibility=hidden -fsanitize=cfi -fno-sanitize-trap=cfi \\
         cfi_test.c -o cfi_test
   ./cfi_test        # "control flow integrity check ... failed" benzeri rapor

   CET / dallanma korumalı derleme (GCC veya clang, x86-64):
   gcc -O2 -fcf-protection=full -fPIE -pie -Wl,-z,relro,-z,now prog.c -o prog
   # ARM64: -mbranch-protection=standard

   İkili denetimi:
   checksec --file=./prog
   readelf -n ./prog | grep -E "IBT|SHSTK"      # x86 özellik işaretleri
   objdump -d ./prog | grep -c endbr64          # giriş noktası işaretleri
   objdump -d ./prog | grep -c "ret"            # kaba ret sayısı, ikililer arası karşılaştırma için */`,
  videolar: [

    `Yukarıdaki cfi_test.c programını CFI olmadan ve -fsanitize=cfi ile derleyin. İki çalıştırmanın çıktısını karşılaştırıp CFI'nin neyi yakaladığını yazın.`,
    `Aynı küçük programı -fcf-protection=none ve -fcf-protection=full ile derleyip objdump ile endbr64 komutlarının sayısını ve readelf -n çıktısındaki işaretleri karşılaştırın.`,
    `Bir statik ve bir dinamik bağlı sürüm derleyip ikili boyutlarını ve ret komutu sayılarını karşılaştırın. Neden statik sürümde çok daha fazla olduğunu savunma açısından yorumlayın.`

    { q: `Shadow stack ile stack canary arasındaki fark nedir?`, a: `Canary dönüş adresinin yakınındaki bozulmayı fonksiyon çıkışında tespit eder. Shadow stack ise dönüş adresinin ayrı ve korumalı bir kopyasını tutup ret anında karşılaştırır, dolayısıyla adres başka bir yolla bozulsa da yakalar.` }
  ],
  ozet: `Özetle: ROP, var olan kod parçalarını yeniden kullanma fikridir. Savunma katmanları (ASLR/PIE, RELRO, canary, CFI, shadow stack, IBT) birlikte kullanılır ve ikilide checksec, readelf ve objdump ile denetlenir. Asıl çözüm bellek hatasının kendisini ortadan kaldırmaktır.`
},
{
  asama: 4, baslik: "WinDbg ile Windows hata ayıklama",
  amac: `Bu derste WinDbg'ın temel komutlarını, sembol sunucusu ayarını ve kendi test programınızın çökme dökümünü (minidump) analiz etmeyi öğreneceksiniz.`,
  anlat: [
    `WinDbg, Microsoft'un Windows için geliştirdiği hata ayıklayıcıdır. Hem kullanıcı kipi programları hem çekirdek kipi, hem de çökme dökümlerini inceleyebilir. Yeni sürümü (WinDbg, eski adıyla WinDbg Preview) Microsoft Store veya winget ile kurulur ve eski komut dizilimi aynen çalışır. x64dbg'den farkı, derleyicinin ürettiği sembol bilgisiyle (PDB) çalışması ve Windows iç yapılarını bilen veri tipi görüntüleyicisidir.`,
    `Önce sembolleri ayarlamak gerekir, çünkü semboller olmadan çağrı yığını anlamsız adreslerden oluşur. Komut satırında .symfix ile Microsoft sembol sunucusu eklenir, kendi PDB dosyalarınız için .sympath+ ile klasör verilir ve .reload ile yeniden yüklenir. Yerel önbellek klasörü SRV*C:\\Symbols*https://msdl.microsoft.com/download/symbols biçiminde de tanımlanabilir. lm komutu yüklü modülleri ve sembol durumlarını listeler, bir modülün sembolü yoksa "deferred" veya "no symbols" görürsünüz.`,

    `Çökme dökümü bir sürecin çökme anındaki belleğinin ve durumunun kaydıdır. Küçük dökümler (minidump) yalnızca yığınları ve temel bilgiyi içerir, tam döküm (/ma) bütün belleği içerir. Windows Hata Bildirimi'ni LocalDumps kayıt defteri anahtarıyla (HKLM\\SOFTWARE\\Microsoft\\Windows\\Windows Error Reporting\\LocalDumps) yapılandırarak belirli bir programın çökmelerinde otomatik döküm aldırabilir, ya da Sysinternals ProcDump ile elle alabilirsiniz. WinDbg'da File menüsünden veya windbg -z dosya.dmp ile açılır. İlk komut genellikle !analyze -v'dir: istisna kodunu, şüpheli modülü, çağrı yığınını ve hatanın bir sınıflandırmasını üretir. Bu çıktı bir tahmindir, bulguyu kaynak kodla doğrulamak size kalır.`,

{
  asama: 4, baslik: "seccomp, namespace ve konteyner sandbox'ları",
  amac: `Bu derste Linux'ta bir programı kısıtlamanın temel yapı taşlarını (seccomp-bpf, namespace'ler), kendi programınıza bir sistem çağrısı filtresi uygulamayı ve sandbox'ın hem savunmadaki hem dinamik analizdeki rolünü öğreneceksiniz.`,
  anlat: [
    `Bir program ele geçirilse bile verebileceği zararı sınırlamak, savunmada ayrı bir katmandır ve buna sandbox denir. Linux'ta bu iş çekirdek özellikleriyle yapılır: seccomp bir sürecin hangi sistem çağrılarını yapabileceğini kısıtlar, namespace'ler sürecin gördüğü kaynakları (süreçler, ağ, dosya sistemi) izole eder, cgroup'lar ise kaynak kullanımını sınırlar. Docker, Podman, Chrome ve systemd gibi yazılımlar bu parçaları birleştirir. Kısaca, bir konteyner "ayrı bir makine" değil, bu özelliklerle sınırlandırılmış sıradan bir süreçtir ve çekirdek konukla paylaşılır.`,
    `seccomp-bpf kipinde süreç, çekirdeğe bir BPF programı (filtre) yükler. Her sistem çağrısında çekirdek bu filtreyi çalıştırır ve sonuca göre çağrıya izin verir (ALLOW), hata numarasıyla reddeder (ERRNO), süreci sonlandırır (KILL_PROCESS), sadece günlüğe yazar (LOG) veya bir izleyiciye bildirir. En güvenli yaklaşım beyaz liste yaklaşımıdır: varsayılan eylem reddetmek, yalnızca gerçekten gereken çağrılara izin vermektir. Filtreyi ham BPF olarak yazmak zahmetlidir, bu yüzden libseccomp kütüphanesi kullanılır. Filtre yüklemeden önce prctl(PR_SET_NO_NEW_PRIVS, 1, ...) çağrılır, böylece süreç ve çocukları setuid gibi yollarla yetki kazanamaz.`,
    `Önemli bir ayrıntı: filtre yüklendikten sonra yalnızca daha da kısıtlanabilir, gevşetilemez. Bu yüzden önce kütüphaneleri, dosyaları ve ağ soketlerini hazırlayıp sonra filtreyi yüklemek yaygın bir desendir. Hangi çağrıların gerektiğini bulmak için programı strace -f -c ile çalıştırıp kullanılan sistem çağrılarını listeleyebilirsiniz. Filtreyi önce SCMP_ACT_LOG ile deneyip günlüğe bakmak (auditd veya dmesg) beklenmedik bir kesintiyi önler. Mimari de önemlidir: aynı filtre x86-64 ve 32 bit uyumluluk çağrılarını farklı numaralarla görür, libseccomp bunu mimari ekleyerek yönetir.`,
    `Namespace türleri şunlardır: mnt (dosya sistemi bağlama noktaları), pid (süreç numaraları), net (ağ arayüzleri), uts (makine adı), ipc, user (kullanıcı ve grup eşlemesi), cgroup ve time (Linux 5.6 ve sonrası). unshare komutuyla kendi kabuğunuzda bunları deneyebilirsiniz: unshare --user --map-root-user --pid --fork --mount-proc --net bash komutu, yeni bir kullanıcı, süreç ve ağ ad alanı içinde bir kabuk açar. Orada ps yalnızca kendi süreçlerinizi, ip link ise yalnızca bir loopback arayüzünü gösterir. Bu ayrıca dinamik analizde işe yarar: şüpheli bir örnek ağsız bir namespace içinde çalıştırılırsa dışarıya çıkamaz.`,

  kodBaslik: "libseccomp ile kendi programını kısıtlamak",
  kod: `/* kisit.c: kendi programınıza beyaz liste filtresi uygulama
   Derleme: gcc kisit.c -o kisit -lseccomp
   (Debian/Ubuntu: libseccomp-dev paketi) */
#include <seccomp.h>
#include <sys/prctl.h>
#include <fcntl.h>
#include <unistd.h>
#include <string.h>
#include <errno.h>

int main(void) {
    const char *m1 = "filtre oncesi: dosya acma basarili olabilir\\n";
    write(1, m1, strlen(m1));

    prctl(PR_SET_NO_NEW_PRIVS, 1, 0, 0, 0);       /* yetki yükseltmeyi kapat */

    /* Varsayılan: izin verilmeyen çağrı EPERM hatası döndürsün */
    scmp_filter_ctx ctx = seccomp_init(SCMP_ACT_ERRNO(EPERM));
    if (!ctx) return 1;

    /* Beyaz liste: yalnızca bunlara izin ver */
    seccomp_rule_add(ctx, SCMP_ACT_ALLOW, SCMP_SYS(write), 0);
    seccomp_rule_add(ctx, SCMP_ACT_ALLOW, SCMP_SYS(exit_group), 0);
    seccomp_rule_add(ctx, SCMP_ACT_ALLOW, SCMP_SYS(rt_sigreturn), 0);

    if (seccomp_load(ctx) < 0) return 2;          /* filtre artık etkin */
    seccomp_release(ctx);

    int fd = open("/etc/hostname", O_RDONLY);      /* openat engellenmeli */
    const char *m2 = (fd < 0 && errno == EPERM)
        ? "engellendi: EPERM\\n" : "beklenmedik: izin verildi\\n";
    write(1, m2, strlen(m2));
    return 0;
}

/* Gözlem:
   ./kisit
   strace -f ./kisit 2>&1 | tail      # openat çağrısının EPERM döndüğünü görün
   SCMP_ACT_KILL_PROCESS ile varsayılanı değiştirip deneyin (SIGSYS ile sonlanır)

   Namespace denemesi:
   unshare --user --map-root-user --pid --fork --mount-proc --net bash

VOID Komut(INS ins, VOID *v) {

}

    `Z3, Microsoft'un yaygın kısıt çözücüsüdür. Python'dan kullanılır. Değişkenler tanımlarsınız, sonra eşitlik ve eşitsizlik gibi kısıtlar eklersiniz ve çözücüye bir çözüm olup olmadığını sorarsınız. Bit vektörleri (BitVec) ile sekiz, otuz iki bitlik kayıtçıların davranışı, taşmalar dahil, doğru modellenir. Bu, ikili dosya analizinde özellikle önemlidir, çünkü 8 bitlik bir toplama 255'te başa sarar.`,

  kodBaslik: "Z3 ile basit bir kontrolü çözmek",
  kod: `# pip install z3-solver
from z3 import *

# Çözmek istediğimiz kontrol (kendi yazdığınız bir fonksiyondan):
#   b0 ^ b1 == 0x1F
#   (b1 + b2) & 0xFF == 0xC8
#   b2 - b3 == 5
b = [BitVec("b%d" % i, 8) for i in range(4)]
s = Solver()
s.add(b[0] ^ b[1] == 0x1F)
s.add(b[1] + b[2] == 0xC8)       # 8 bitlik toplama: taşma modellenir
s.add(b[2] - b[3] == 5)
for x in b:                      # yazdırılabilir karakterler olsun
    s.add(x >= 0x20, x <= 0x7E)

if s.check() == sat:
    m = s.model()
    print(bytes(m[x].as_long() for x in b))   # çözüm birden çok olabilir

{
  asama: 5, baslik: "Windows süreç iç yapıları: PEB, TEB ve istisna işleme",
  amac: `Bu derste Windows'ta bir sürecin iç veri yapılarını (TEB ve PEB), istisna işleme mekanizmasını ve bunların analizde nasıl göründüğünü öğreneceksiniz.`,
  anlat: [
    `Windows'ta her iş parçacığının bir TEB'i (Thread Environment Block) ve her sürecin bir PEB'i (Process Environment Block) vardır. Bunlar, kullanıcı alanında bulunan ve sürecin ve iş parçacığının durumunu tutan yapılardır. x64'te gs segment kaydı TEB'i gösterir. gs:[0x60] konumunda PEB'in adresi bulunur. Bu yüzden assembly'de mov rax, gs:[0x60] gördüğünüzde program PEB'e erişiyordur. 32 bitte aynı iş fs ile yapılır.`,
    `PEB içinde analiz için önemli alanlar vardır. Ofset 2'deki BeingDebugged baytı, bir debugger bağlıysa birdir. IsDebuggerPresent API'si aslında bu baytı okur. Ofset 0x18'deki Ldr alanı, sürece yüklenen tüm modüllerin (DLL'lerin) listesine işaret eder. Bazı programlar API'leri import tablosundan değil, bu listeyi gezip modülü ve fonksiyonu kendisi bularak çağırır. Bu yüzden import listesi boş veya şüpheli şekilde küçük bir program, bu kalıbı kullanıyor olabilir. Kodda gs:[0x60] erişimi, ardından ofset 0x18 ve bir liste gezisi görürseniz bunu tanıyabilirsiniz.`,
    `Yapısal istisna işleme (SEH), Windows'ta hataları yakalamanın yoludur. 32 bit x86'da istisna kayıtları fs:[0] konumundan başlayan bir zincir olarak stack'te tutulur. x64'te ise bu zincir yoktur. Bunun yerine her fonksiyon için istisna ve geri sarma bilgisi, PE dosyasındaki .pdata bölümünde saklanır ve işleyiciler bu tablolardan bulunur. Ghidra bu bilgiyi fonksiyon sınırlarını bulmak için de kullanır. Ayrıca AddVectoredExceptionHandler ile kayıt edilen vektörel işleyiciler bir sürecin her istisnasını yakalayabilir.`,
    `İstisnalar analizde şu yüzden önemlidir: bazı programlar bilerek bir istisna üretir, örneğin int 3 komutuyla veya sıfıra bölerek, ve asıl akışı istisna işleyicisinde sürdürür. Debugger altında bu istisna önce debugger'a gittiği için program farklı davranır. Bu, bir anti-debug tekniğidir. x64dbg'de istisnaların programa iletilmesi için seçenekler vardır. Bir programın istisna işleyicisinde kritik mantık görüyorsanız bunu aklınızda tutun.`,
    `Handle'lar ve çekirdek nesneleri de önemlidir. CreateFile, CreateProcess veya RegOpenKey gibi çağrılar bir handle döndürür. Bu, çekirdek nesnesine işaret eden bir tamsayıdır. Process Explorer ve Process Monitor bu nesneleri ve erişimlerini gösterir. Bir programın hangi dosyaları, kayıt defteri anahtarlarını ve mutex'leri açtığını bu araçlarla görmek, kod okumaya başlamadan önce çok zaman kazandırır. Bu çalışmaları izole bir sanal makinede yapın.`
  ],
  kodBaslik: "PEB erişimi ve SEH örneği",
  kod: `; x64'te PEB'e erişim kalıbı (tanımak için)
mov  rax, QWORD PTR gs:[0x60]     ; rax = PEB adresi
movzx ecx, BYTE PTR [rax+2]       ; PEB.BeingDebugged
mov  rdx, QWORD PTR [rax+0x18]    ; PEB.Ldr (yüklü modül listesi)

/* Kendi programınızda deneyin (MSVC) */

}`,

{
  asama: 5, baslik: "Windows çekirdek sürücüleri: DriverEntry, IRP ve IOCTL",
  amac: `Bu derste bir Windows çekirdek sürücüsünün temel iskeletini (DriverEntry, aygıt nesnesi, IRP, IOCTL), sürücüyü bir sanal makinede nasıl derleyip yükleyeceğinizi, WinDbg ile hata ayıklamaya girişi ve bir sürücü ikilisini Ghidra'da okuma yaklaşımını öğreneceksiniz.`,
  anlat: [
    `Windows çekirdek sürücüsü, ring 0'da çalışan bir .sys dosyasıdır (PE biçiminde). Kullanıcı modundaki bir program ile donanım ya da çekirdek hizmetleri arasında köprü kurar. Sürücü yüklenirken çekirdek DriverEntry fonksiyonunu çağırır. Bu fonksiyon, C'deki main'e benzer bir giriş noktasıdır: burada aygıt nesnesi oluşturulur, kullanıcı modundan erişim için sembolik bir bağlantı eklenir ve dispatch rutinleri DRIVER_OBJECT içindeki MajorFunction tablosuna yazılır. Sürücü kaldırılırken DriverUnload rutini oluşturulan her şeyi geri almalıdır, aksi halde kaynak sızar.`,
    `Kullanıcı ile sürücü arasındaki iletişim IRP (I/O Request Packet) adı verilen paketlerle yürür. Kullanıcı modunda CreateFile, ReadFile, WriteFile, DeviceIoControl ve CloseHandle gibi çağrılar yapıldığında I/O yöneticisi bir IRP oluşturur ve sürücünün ilgili IRP_MJ_CREATE, IRP_MJ_READ, IRP_MJ_DEVICE_CONTROL, IRP_MJ_CLOSE rutinine iletir. Rutin, IoGetCurrentIrpStackLocation ile isteğin ayrıntılarını okur, işi yapar, durum kodunu ve aktarılan bayt sayısını yazar ve IoCompleteRequest ile paketi tamamlar. Sürücüler genellikle IOCTL kodlarıyla özel komutlar sunar. Bir IOCTL kodu CTL_CODE makrosuyla aygıt tipi, işlev numarası, aktarım yöntemi (METHOD_BUFFERED, METHOD_IN_DIRECT, METHOD_OUT_DIRECT, METHOD_NEITHER) ve erişim hakkından üretilir.`,

  kodBaslik: "En küçük WDM sürücüsü: aygıt, sembolik bağlantı ve IOCTL",
  kod: `/* lab.c : yalnızca test imzalama modundaki SANAL MAKİNEDE yükleyin */
#include <ntddk.h>

#define IOCTL_LAB_ARTIR CTL_CODE(FILE_DEVICE_UNKNOWN, 0x800, METHOD_BUFFERED, FILE_ANY_ACCESS)

static UNICODE_STRING g_aygit = RTL_CONSTANT_STRING(L"\\\\Device\\\\LabAygit");
static UNICODE_STRING g_link  = RTL_CONSTANT_STRING(L"\\\\DosDevices\\\\LabAygit");

static NTSTATUS Tamamla(PIRP irp, NTSTATUS st, ULONG_PTR bilgi) {
    irp->IoStatus.Status = st;
    irp->IoStatus.Information = bilgi;
    IoCompleteRequest(irp, IO_NO_INCREMENT);
    return st;
}

static NTSTATUS DispatchCreateClose(PDEVICE_OBJECT dev, PIRP irp) {
    UNREFERENCED_PARAMETER(dev);
    return Tamamla(irp, STATUS_SUCCESS, 0);
}

static NTSTATUS DispatchIoctl(PDEVICE_OBJECT dev, PIRP irp) {
    UNREFERENCED_PARAMETER(dev);
    PIO_STACK_LOCATION sp = IoGetCurrentIrpStackLocation(irp);
    ULONG kod = sp->Parameters.DeviceIoControl.IoControlCode;
    ULONG girdi = sp->Parameters.DeviceIoControl.InputBufferLength;
    ULONG cikti = sp->Parameters.DeviceIoControl.OutputBufferLength;

    if (kod == IOCTL_LAB_ARTIR) {
        /* uzunlukları DOĞRULA: güvenli sürücünün ilk kuralı */
        if (girdi < sizeof(ULONG) || cikti < sizeof(ULONG))
            return Tamamla(irp, STATUS_BUFFER_TOO_SMALL, 0);
        ULONG *tampon = (ULONG *)irp->AssociatedIrp.SystemBuffer; /* METHOD_BUFFERED */
        *tampon = *tampon + 1;                 /* girdi ve çıktı aynı tamponu paylaşır */
        return Tamamla(irp, STATUS_SUCCESS, sizeof(ULONG));
    }
    return Tamamla(irp, STATUS_INVALID_DEVICE_REQUEST, 0);
}

static VOID LabUnload(PDRIVER_OBJECT drv) {
    IoDeleteSymbolicLink(&g_link);
    IoDeleteDevice(drv->DeviceObject);
}

NTSTATUS DriverEntry(PDRIVER_OBJECT drv, PUNICODE_STRING kayit) {
    UNREFERENCED_PARAMETER(kayit);
    PDEVICE_OBJECT dev;
    NTSTATUS st = IoCreateDevice(drv, 0, &g_aygit, FILE_DEVICE_UNKNOWN,
                                 FILE_DEVICE_SECURE_OPEN, FALSE, &dev);
    if (!NT_SUCCESS(st)) return st;
    st = IoCreateSymbolicLink(&g_link, &g_aygit);
    if (!NT_SUCCESS(st)) { IoDeleteDevice(dev); return st; }

    drv->MajorFunction[IRP_MJ_CREATE]         = DispatchCreateClose;
    drv->MajorFunction[IRP_MJ_CLOSE]          = DispatchCreateClose;
    drv->MajorFunction[IRP_MJ_DEVICE_CONTROL] = DispatchIoctl;
    drv->DriverUnload = LabUnload;
    return STATUS_SUCCESS;
}

/* Komutlar (yönetici komut istemi, SANAL MAKİNE):
   bcdedit /set testsigning on          -> yeniden başlat
   sc create LabSrv type= kernel binPath= C:\\\\lab\\\\lab.sys
   sc start LabSrv    /   sc stop LabSrv    /   sc delete LabSrv

  amac: `Bu derste bir Linux çekirdeğini QEMU içinde GDB ile adım adım ayıklamayı, sembolleri yüklemeyi, KASLR'ı kapatmayı, kgdb'ye girişi ve bir oops ya da panic çıktısını addr2line ile kaynak satırına çevirmeyi öğreneceksiniz.`,

    `Çekirdeği ayıklamanın en güvenli yolu onu bir sanal makinede çalıştırıp dışarıdan bağlanmaktır. QEMU, -s seçeneğiyle (-gdb tcp::1234 kısaltması) bir GDB sunucusu açar, -S seçeneğiyle de işlemciyi başlangıçta dondurur. Böylece çekirdek bir tek komut çalıştırmadan önce GDB'nin gelip kesme noktalarını koymasını beklemiş olur. Ana makinede GDB başlatılır ve target remote :1234 ile sanal makineye bağlanılır. Bu yöntemde çalıştığınız çekirdek yalnızca konuktadır, hata yaparsanız ana sisteminiz etkilenmez.`,
    `Anlamlı bir ayıklama için derleme sırasında hata ayıklama bilgisi gerekir (CONFIG_DEBUG_INFO ve ilgili seçenekler). Derleme çıktısı olan vmlinux dosyası sembolleri ve DWARF bilgisini taşır, bzImage ise yalnızca sıkıştırılmış önyüklenebilir görüntüdür. GDB'ye vmlinux'u verirsiniz: gdb vmlinux. Dağıtım çekirdeklerinin hata ayıklama paketleri ayrı kurulur ve adları dağıtıma göre değişir. En kolay yol, küçük bir yapılandırmayla kendi çekirdeğinizi derleyip bir minimal initramfs ile çalıştırmaktır.`,
    `KASLR (çekirdek adres alanı rastgeleleştirmesi) çekirdeğin yükleme adresini her açılışta değiştirir, bu yüzden vmlinux içindeki adresler çalışan çekirdekle uyuşmaz ve kesme noktaları tutmaz. Ayıklama için çekirdek komut satırına nokaslr eklenir. Başlangıçta yazılım kesme noktaları bazen sorun çıkardığından erken aşamalar için hbreak (donanım kesme noktası) önerilir. Çekirdeği kaynak seviyesinde gezerken optimizasyon yüzünden değişkenlerin optimized out görünmesi ve satırların atlaması normaldir. Çekirdek GDB yardımcı betikleri (CONFIG_GDB_SCRIPTS ile gelen scripts/gdb) lx-symbols gibi komutlarla yüklü modüllerin sembollerini de yükler.`,

    `Çekirdek bir hata yakaladığında oops ya da panic mesajı basar. Mesajda hatanın türü (örneğin NULL pointer dereference), RIP satırı (func+0x1a/0x40 gibi fonksiyon artı ofset), kayıtçı dökümü ve çağrı izi (Call Trace) bulunur. Bu ofseti kaynak satırına çevirmek için addr2line -e vmlinux -f -i ADRES kullanılır ya da GDB içinde list *(func+0x1a) yazılır. Çekirdek kaynağındaki scripts/decode_stacktrace.sh tüm izi bir seferde çözer. Pratikte bu beceri, çekirdek modülü veya sürücü yazarken ve çökme raporlarını incelerken en çok işe yarayan araçtır.`

#include <stdio.h>
#include <string.h>
#include <cpuid.h>
#include <fcntl.h>
#include <unistd.h>
#include <sys/ioctl.h>
#include <linux/kvm.h>

int main(void) {
    unsigned a, b, c, d;

    /* Donanım destek bayrağı: Intel vmx, AMD svm (leaf 1 ECX bit5 = VMX) */
    __cpuid(1, a, b, c, d);
    printf("VMX destegi      : %s\\n", (c & (1u << 5)) ? "var" : "yok");
    printf("hypervisor biti  : %s\\n", (c & (1u << 31)) ? "1 (sanal ortam)" : "0");

    /* Hipervizör üretici dizgisi (bit 31 açıksa anlamlı) */
    if (c & (1u << 31)) {
        char v[13];
        __cpuid(0x40000000, a, b, c, d);
        memcpy(v, &b, 4); memcpy(v + 4, &c, 4); memcpy(v + 8, &d, 4);
        v[12] = 0;
        printf("hipervizor adi   : %s\\n", v);   /* örn. KVMKVMKVM */
    }

    /* KVM kullanıcı alanı API'si: QEMU'nun yaptığı işin ilk adımı */
    int kvm = open("/dev/kvm", O_RDWR);
    if (kvm >= 0) {
        printf("KVM API surumu   : %d\\n", ioctl(kvm, KVM_GET_API_VERSION, 0));  /* 12 */
        int vm = ioctl(kvm, KVM_CREATE_VM, 0);                                   /* bos VM */
        printf("KVM_CREATE_VM    : fd=%d\\n", vm);
        if (vm >= 0) close(vm);
        close(kvm);
    } else {
        printf("/dev/kvm acilamadi (modul yuklu degil ya da yetki yok)\\n");
    }
    return 0;
}`,

   mov eax, 42 ; ret   -> B8 2A 00 00 00 C3 */
#include <stdio.h>
#include <string.h>
#include <sys/mman.h>

int main(void) {
    unsigned char kod[] = { 0xB8, 0x2A, 0x00, 0x00, 0x00, 0xC3 };

    /* 1) Önce yazılabilir (RW) sayfa: W^X gereği hem yaz hem çalıştır YOK */
    void *p = mmap(NULL, 4096, PROT_READ | PROT_WRITE,
                   MAP_PRIVATE | MAP_ANONYMOUS, -1, 0);
    if (p == MAP_FAILED) { perror("mmap"); return 1; }
    memcpy(p, kod, sizeof kod);

    /* 2) Sonra yalnızca okunur+çalıştırılır (RX) yap */
    if (mprotect(p, 4096, PROT_READ | PROT_EXEC) != 0) { perror("mprotect"); return 1; }

    int (*f)(void) = (int (*)(void))p;
    printf("JIT sonucu: %d\\n", f());     /* 42 */
    munmap(p, 4096);
    return 0;
}

  anlat: [

    `IR'ı görmek için clang -S -emit-llvm dosya.c -o dosya.ll komutu kullanılır. IR, SSA (Static Single Assignment) biçimindedir: her değer yalnızca bir kez atanır ve %t1, %t2 gibi adlarla anılır. Fonksiyon temel bloklardan (basic block) oluşur; her blok bir etiketle başlar ve tam olarak bir sonlandırıcı komutla (br, ret, switch) biter. Dallanmalarda aynı değişkenin farklı yollardan gelen değerlerini birleştirmek için phi komutu kullanılır: phi i32 [ 0, %entry ], [ %i.next, %dongu ] ifadesi, bloğa hangi bloktan gelindiğine göre değeri seçer. Türler açıktır (i32, i64, ptr) ve işlemler add, mul, icmp, load, store, getelementptr gibi komutlardır.`,

$ clang -O2 -S -masm=intel topla.c -o topla2.s

; mem2reg sonrası (elle sadeleştirilmiş, n >= 1 varsayımıyla): phi ortaya çıkar
define i32 @topla(i32 %n) {
entry:
  br label %dongu
dongu:
  %i = phi i32 [ 0, %entry ], [ %i.next, %dongu ]
  %s = phi i32 [ 0, %entry ], [ %s.next, %dongu ]
  %s.next = add i32 %s, %i
  %i.next = add i32 %i, 1
  %c = icmp slt i32 %i.next, %n
  br i1 %c, label %dongu, label %cik
cik:
  ret i32 %s.next
}
